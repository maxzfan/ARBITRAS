name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# The Pages project is direct-upload, so two overlapping `wrangler pages deploy`
# runs would race for the production alias.
concurrency:
  group: pages-deploy

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 60          # a cold cache re-parses the whole RINEX day
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'          # gnss-lib-py caps at <3.13
      # bootstrap.sh takes `command -v python3.12` before its Homebrew branch,
      # which is what the line above puts on PATH.

      # Every input build_static reads is gitignored: the RINEX day and the
      # signed pre-map (data/), the georinex parse cache (.cache/), and the
      # Poly Haven assets. Restoring them is the difference between a ~2 min
      # build and a ~20 min one. Bump -v1 to force a cold rebuild.
      - uses: actions/cache@v4
        with:
          path: |
            data
            .cache
            console/web/vendor/asset-env-*
          key: arbitras-inputs-v1-${{ hashFiles('bootstrap.sh', 'console/web/env/ASSETS.txt') }}
          # Editing bootstrap.sh must not force a cold Overpass fetch: fall back
          # to the last cache, let bootstrap.sh top up what changed, re-save.
          restore-keys: arbitras-inputs-v1-

      - uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: arbitras-pip-v1-${{ hashFiles('bootstrap.sh') }}
          restore-keys: arbitras-pip-v1-

      - run: bash bootstrap.sh

      # Each `run:` is a fresh shell; activate the venv once for all of them.
      - run: echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      # bootstrap.sh does not install pytest and the deploy is gated on one test.
      - run: pip install -q pytest

      # backend.missions' casevac spec calls load_verified(), which raises on a
      # missing map, and bootstrap.sh fetches the RINEX day but not the pre-map.
      # fetch() short-circuits on data/terrain_usn8_osm.json, so Overpass is hit
      # only when the inputs cache above misses; --sign mints the keypair if
      # absent.
      #
      # Retried because a cold cache is not the rare case it looks like:
      # actions/cache only SAVES on a successful run, so once the deploy starts
      # failing every subsequent run is cold too, and one 504 from a free public
      # endpoint keeps it that way. Run 34037489897 died exactly there. On a
      # cache hit the fetch is a no-op and attempt 1 returns immediately.
      - name: Pre-map (Track E)
        run: |
          if [ -s data/terrain_usn8.npz ]; then exit 0; fi
          for attempt in 1 2 3; do
            if python -m backend.terrain.fetch_map --radius 600 --cell 5 --sign; then
              exit 0
            fi
            echo "pre-map attempt $attempt failed; retrying in $((attempt * 30))s"
            sleep $((attempt * 30))
          done
          echo "::error::Overpass did not answer after 3 attempts"
          exit 1

      - run: python -m backend.demo
      - run: python -m backend.missions --mission all

      - run: python -m deploy.build_static            # spec §5 check 1

      # The check that catches build/server drift. Targeted rather than the full
      # suite: an unrelated failure must not hold the judges' URL.
      - run: pytest -q console/tests/test_static_build.py

      # --commit-dirty because backend.demo and backend.missions rewrite
      # docs/stream_provenance*.md, which leaves the tree dirty by this point.
      - name: Deploy
        run: |
          npx wrangler@4 pages deploy site/ --project-name arbitras \
            --branch main --commit-hash "$GITHUB_SHA" --commit-dirty=true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # spec §5 check 2. A wrong Content-Type on the HDR or the wasm fails
      # silently in the browser -- no sky, or no vehicle, and nothing logged.
      # Retried because the production alias can lag the deploy by a few seconds.
      - name: MIME probe
        run: |
          for i in 1 2 3; do
            if python -m deploy.build_static --probe https://arbitras.pages.dev; then
              exit 0
            fi
            echo "attempt $i failed; the alias may still be propagating"
            sleep 15
          done
          exit 1
