<!doctype html>
<meta charset="utf-8">
<title>HOLDFAST</title>
<style>
  /* Vendored so the console runs offline (design.md §14: venue wifi is a risk).
     font-display:block avoids a flash of fallback metrics mid-capture. */
  @font-face{font-family:'IBM Plex Sans';font-weight:400;font-display:block;
             src:url('/vendor/plex-sans-400.woff2') format('woff2')}
  @font-face{font-family:'IBM Plex Sans';font-weight:500;font-display:block;
             src:url('/vendor/plex-sans-500.woff2') format('woff2')}
  @font-face{font-family:'IBM Plex Sans';font-weight:600;font-display:block;
             src:url('/vendor/plex-sans-600.woff2') format('woff2')}
  @font-face{font-family:'IBM Plex Sans';font-weight:700;font-display:block;
             src:url('/vendor/plex-sans-700.woff2') format('woff2')}
  @font-face{font-family:'IBM Plex Mono';font-weight:400;font-display:block;
             src:url('/vendor/plex-mono-400.woff2') format('woff2')}
  @font-face{font-family:'IBM Plex Mono';font-weight:500;font-display:block;
             src:url('/vendor/plex-mono-500.woff2') format('woff2')}
  @font-face{font-family:'IBM Plex Mono';font-weight:600;font-display:block;
             src:url('/vendor/plex-mono-600.woff2') format('woff2')}
  /* Inter stays vendored as the fallback tier. */
  @font-face{font-family:'Inter';font-weight:400;font-display:block;
             src:url('/vendor/inter-400.woff2') format('woff2')}
  @font-face{font-family:'Inter';font-weight:500;font-display:block;
             src:url('/vendor/inter-500.woff2') format('woff2')}
  @font-face{font-family:'Inter';font-weight:600;font-display:block;
             src:url('/vendor/inter-600.woff2') format('woff2')}
  @font-face{font-family:'Inter';font-weight:700;font-display:block;
             src:url('/vendor/inter-700.woff2') format('woff2')}
  :root{
    --bg:#0B0D0F; --panel:#0E1114; --line:#1C222A; --keyline:#2B333D;
    --fg:#EEF2F6; --dim:#8794A2; --faint:#4E5A67;
    --accent:#E4551F;
    --nominal:#D8E2EC; --degraded:#E8A21C; --restricted:#E4551F; --surrendered:#D62119;
    --believed:#E4551F; --truth:#7FA8CC;
    /* Three tiers, deliberately: condensed-black for display numbers, Plex Sans
       for prose and labels, Plex Mono for aligned instrument data. */
    --display:"Helvetica Neue","Arial Narrow",Impact,system-ui,sans-serif;
    --sans:'IBM Plex Sans','Inter',system-ui,sans-serif;
    --mono:'IBM Plex Mono',ui-monospace,"SF Mono",Menlo,monospace;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{background:var(--bg);color:var(--fg);font:13px/1.5 var(--sans);
       -webkit-font-smoothing:antialiased;overflow:hidden}
  #root{height:100vh;display:flex;flex-direction:column}
  .banners{flex:0 0 auto}
  .banner{padding:8px 20px;font-size:11px;letter-spacing:.14em;text-transform:uppercase;
          text-align:center;font-weight:600;font-family:var(--sans)}
  .banner.synthetic{background:var(--surrendered);color:#fff}
  .banner.provenance{background:#2A2410;color:var(--degraded);
                     border-bottom:1px solid #453A18}
  .banner.unverified{background:var(--surrendered);color:#fff}

  /* ---- horizontal instrument strip -------------------------------------
     Fixed height on purpose: the stage below must start at the same y in
     every configuration, so the Trust layer badge is pixel-identical
     between layer=on and layer=off (design.md §11b). */
  .strip{flex:0 0 auto;height:156px;display:flex;
         border-bottom:1px solid var(--keyline);background:var(--panel)}
  .cell{padding:13px 17px;border-right:1px solid var(--line);min-width:0;
        display:flex;flex-direction:column;overflow:hidden}
  .cell:last-child{border-right:0}
  /* flex-basis sets the comfortable width, min-width the hard floor. Floors sum
     to ~1275px so nothing clips down to a 1280 viewport. */
  .c-auth{flex:0 1 330px;min-width:268px}
  .c-conf{flex:1 1 250px;min-width:186px}
  .c-feat{flex:1 1 380px;min-width:220px}
  .c-geom{flex:1 1 430px;min-width:404px}
  .c-drop{flex:0 0 196px;min-width:196px}
  .lbl{font-family:var(--sans);font-weight:600;font-size:10px;letter-spacing:.16em;
     color:var(--faint);text-transform:uppercase;margin-bottom:9px;white-space:nowrap}
  .state{font-family:var(--display);font-weight:900;font-size:40px;line-height:.94;
         letter-spacing:-.02em;font-stretch:condensed;text-transform:uppercase}
  .sub{font-family:var(--sans);font-size:12.5px;color:var(--dim);margin-top:8px;
     line-height:1.4}
  .conf{font-family:var(--display);font-weight:900;font-size:40px;line-height:1;
        letter-spacing:-.02em;font-variant-numeric:tabular-nums}
  .bigrow{display:flex;align-items:baseline;gap:11px;flex-wrap:wrap}
  .cred{font-family:var(--sans);font-weight:500;font-size:10px;letter-spacing:.12em;
      text-transform:uppercase;color:var(--dim)}
  .bar{height:8px;background:#171C22;position:relative;margin-top:13px;
       border:1px solid var(--line)}
  .bar>span{position:absolute;left:0;top:0;bottom:0}
  .tick{position:absolute;top:-3px;bottom:-3px;width:1px;background:var(--faint)}
  .frows{display:flex;flex-direction:column;gap:6px}
  .frow{display:flex;align-items:center;gap:10px;font-size:11px}
  .frow .n{font-family:var(--sans);font-weight:500;flex:0 1 112px;min-width:92px;
           color:var(--dim);text-transform:uppercase;font-size:10px;letter-spacing:.07em;
           white-space:nowrap}
  .frow .fb{flex:1 1 auto;height:7px;background:#171C22;position:relative;
            border:1px solid var(--line);min-width:24px}
  .frow .fb>span{position:absolute;inset:0 auto 0 0}
  .frow .v{font-family:var(--mono);width:36px;text-align:right;
         font-variant-numeric:tabular-nums;font-size:11px;flex:0 0 auto}
  .geo{display:flex;gap:20px;align-items:flex-start;min-width:0}
  .boundwrap{flex:0 0 auto}
  .bound{font-family:var(--display);font-weight:900;font-size:44px;line-height:1;
         letter-spacing:-.03em;font-variant-numeric:tabular-nums;color:var(--accent);
         white-space:nowrap}
  .bound.none{color:var(--faint)}
  .boundlbl{font-family:var(--sans);font-weight:600;font-size:10px;color:var(--dim);
            letter-spacing:.11em;text-transform:uppercase;margin-top:6px;max-width:120px;
            line-height:1.3}
  .geokv{flex:1 1 auto;min-width:0}
  .kv{font-family:var(--mono);display:flex;justify-content:space-between;gap:14px;
    font-size:11px;margin:4px 0;color:var(--dim);letter-spacing:0;
    white-space:nowrap;font-variant-numeric:tabular-nums}
  .kv b{color:var(--fg);font-weight:500;font-variant-numeric:tabular-nums}
  .sv{display:flex;flex-wrap:wrap;gap:5px}
  .sv span{font-family:var(--mono);font-size:10px;padding:3px 6px;
         border:1px solid var(--accent);color:var(--accent);letter-spacing:.04em}
  .sv span.none{border-color:var(--line);color:var(--faint)}
  .c-drop .lbl{white-space:normal;line-height:1.35}

  /* ---- stage: map pane + sky pane ------------------------------------ */
  .stage{flex:1;position:relative;min-height:0;overflow:hidden;display:flex}
  .pane{position:relative;flex:1 1 0;min-width:0;min-height:0;overflow:hidden}
  .pane+.pane{border-left:1px solid var(--line)}
  .pane svg{position:absolute;inset:0;width:100%;height:100%;display:block}
  .kbox{border:1px solid var(--keyline);background:#0B0D0Fcc;padding:9px 12px}
  .layer{position:absolute;top:20px;right:20px;z-index:5;font-size:11px;
         letter-spacing:.16em;text-transform:uppercase}
  .layer b{color:var(--fg);font-weight:700;display:inline-block;width:30px;
         text-align:left}
  .layer.off b{color:var(--surrendered)}
  .readout{position:absolute;top:18px;left:20px;z-index:5}
  .readout .n{font-family:var(--display);font-weight:900;font-size:58px;line-height:.9;
              letter-spacing:-.03em;font-stretch:condensed;color:var(--accent)}
  .readout .n.safe{color:var(--dim)}
  .readout .u{font-family:var(--sans);font-weight:600;font-size:11px;letter-spacing:.13em;
            color:var(--dim);text-transform:uppercase;margin-top:6px}
  .legend{position:absolute;top:120px;left:20px;z-index:5;font-family:var(--sans);
        font-weight:500;font-size:11px;letter-spacing:.08em;text-transform:uppercase;
        color:var(--dim)}
  .legend div{display:flex;align-items:center;gap:9px;margin-top:6px}
  .legend i{width:26px;height:0;border-top:2px solid}
  .legend i.sw{width:8px;height:8px;border:0}
  .hint{position:absolute;bottom:18px;right:20px;z-index:5;font-family:var(--sans);
      font-weight:500;font-size:10px;letter-spacing:.12em;text-transform:uppercase;
      color:var(--faint)}
  .idle{display:flex;height:100%;align-items:center;justify-content:center;
      font-family:var(--sans);font-weight:500;color:var(--faint);font-size:11px;
      letter-spacing:.16em;text-transform:uppercase}

  /* sky dome */
  .sky{position:absolute;inset:0}
  .sky canvas{display:block;width:100%;height:100%}
  .skylabels{position:absolute;inset:0;pointer-events:none;overflow:hidden}
  .skl{position:absolute;transform:translate(0,-50%);font-family:var(--mono);
       font-size:10px;letter-spacing:.04em;white-space:nowrap;color:var(--truth)}
  .skl.x{color:var(--accent)}
  .skl.cmp{font-family:var(--sans);font-weight:600;font-size:11px;letter-spacing:.16em;
           color:var(--dim);transform:translate(-50%,-50%)}
  .skycap{position:absolute;left:20px;z-index:5;font-family:var(--sans);font-weight:600;
          font-size:11px;letter-spacing:.13em;text-transform:uppercase;color:var(--dim)}
  .skycap .n2{font-family:var(--mono);font-weight:400;font-size:10px;color:var(--faint);
              margin-top:5px;letter-spacing:.02em;text-transform:none}
  .skycap .n2 b{color:var(--fg);font-weight:500}
  .skyleg{position:absolute;bottom:18px;left:20px;z-index:5;font-family:var(--sans);
          font-weight:500;font-size:11px;letter-spacing:.08em;text-transform:uppercase;
          color:var(--dim)}
  .skyleg div{display:flex;align-items:center;gap:9px;margin-top:6px}
  .skyleg i{width:8px;height:8px;display:inline-block}
  .skyidle{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
           font-family:var(--sans);font-weight:500;color:var(--faint);font-size:11px;
           letter-spacing:.16em;text-transform:uppercase;pointer-events:none}

  /* ---- explanation ----------------------------------------------------- */
  /* Always rendered, at a FIXED height, so the flex .stage above it -- and the
     WebGL canvas inside it -- never change size as the text re-wraps from epoch
     to epoch (a canvas resize clears the drawing buffer and paints one black
     frame, and the scene jumps when the pane's aspect changes). The height is
     the tallest layout observed: every §5 record in out/{demo,carryoff,clean,
     live}.jsonl replayed through the arbiter (641 distinct explanations) and
     rendered at viewport widths 1100-1920 needs at most 3 headline lines and
     4 detail lines; 4 detail lines (13px x 1.62) is the taller column, plus the
     15px vertical padding and the 1px top border (border-box). Longer text is
     clamped with an ellipsis rather than allowed to grow the bar. */
  .expbar{flex:0 0 auto;border-top:1px solid var(--keyline);background:#0A0C0E;
          padding:15px 24px;display:grid;grid-template-columns:minmax(260px,26%) 1fr;
          gap:30px;align-items:start;overflow:hidden;
          height:calc(4 * 13px * 1.62 + 30px + 1px)}
  /* env view: three columns -- summary | detail | scene key -- at a FIXED height
     (8 lines of the 15px key: five items, then the counts line wrapping to at most
     three), so the bar is still a constant height in every configuration and
     nothing above it can resize. The detail column is narrower here, so it may
     clamp at 5 lines instead of 4. */
  .expbar.env{height:calc(8 * 15px + 30px + 1px);grid-template-columns:minmax(220px,22%) 1fr auto;gap:24px}
  .expbar.env .d{-webkit-line-clamp:5}
  .expkey{height:120px;max-width:380px;overflow:hidden;
          font-family:var(--sans);font-weight:500;font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--dim)}
  .expkey .keys div{display:flex;align-items:center;gap:8px;white-space:nowrap;line-height:15px}
  .expkey i{width:8px;height:8px;display:inline-block;flex:0 0 auto}
  .expkey i.gh{background:#E4551F66;outline:1px solid var(--accent);outline-offset:-1px}
  .expkey .n2{font-family:var(--mono);font-weight:400;font-size:10px;color:var(--faint);letter-spacing:.02em;
              text-transform:none;line-height:15px}
  .expkey .n2 b{color:var(--fg);font-weight:500}
  .expkey .st{color:var(--degraded);letter-spacing:.04em}
  .expbar .h{font-family:var(--sans);font-weight:700;font-size:19px;line-height:1.28;
           letter-spacing:-.005em;display:-webkit-box;-webkit-box-orient:vertical;
           -webkit-line-clamp:3;overflow:hidden}
  .expbar .d{font-family:var(--sans);font-weight:400;font-size:13px;color:var(--dim);
           line-height:1.62;max-width:132ch;display:-webkit-box;-webkit-box-orient:vertical;
           -webkit-line-clamp:4;overflow:hidden}

  /* ---- 3D environment ------------------------------------------------- */
  .skl.env{text-shadow:0 1px 2px #000,0 0 6px #000c}
  .skl.al{color:var(--degraded)}
  .skl.lb{margin-left:16px}
  .stage.env::before,.stage.env::after{content:'';position:absolute;left:0;right:0;pointer-events:none;z-index:4}
  .stage.env::before{top:0;height:270px;background:linear-gradient(rgba(6,8,10,.82),rgba(6,8,10,0))}
  .stage.env::after{bottom:0;height:150px;background:linear-gradient(rgba(6,8,10,0),rgba(6,8,10,.78))}
  .stage.env .readout .n.safe{color:var(--fg)}
  .stage.env .readout .n,.stage.env .readout .u,.stage.env .hint{text-shadow:0 1px 3px #000c,0 0 10px #0009}
  /* Bottom band of the env stage: caption + attribution bottom-left, the satellite
     view in the actual bottom-right corner; the hint moves under the trust-layer
     box and the scene key lives in the footer bar (.expkey). --insetW is the inset
     MAP width; the panel adds 2x8px padding + 2x1px border. */
  .stage.env{--insetW:260px}
  .stage.env .hint{top:64px;bottom:auto}
  .stage.env .rcap{bottom:36px}
  /* satellite-view inset: a rendered top-down of the scene, not imagery. The only
     measured thing in it is the offset between the two pins (st.Dmag, as the readout). */
  .inset{position:absolute;right:20px;bottom:18px;z-index:5;width:calc(var(--insetW) + 18px);
         border:1px solid var(--keyline);background:#0B0D0Fd9;padding:8px 8px 7px;
         font-family:var(--sans);font-weight:500;font-size:9px;letter-spacing:.1em;
         text-transform:uppercase;color:var(--faint);text-shadow:0 1px 2px #000c,0 0 8px #0008}
  .inset .map{position:relative;width:100%;overflow:hidden;background:#0E1114}
  .inset .map canvas{display:block}
  .inset .cap{margin-top:7px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .inset .cap b{color:var(--dim);font-weight:500}
  .inset .pin{stroke:#0B0D0F;stroke-width:1;fill-rule:evenodd}
  .inset .pin.t{fill:#8A857A}
  .inset .pin.b{fill:var(--accent)}
  .inset .pin.edge{fill-opacity:.35}            /* clamped to the frame edge: beyond the framed margin */
  .inset .link{stroke:var(--accent);stroke-width:1;stroke-dasharray:3 3;opacity:.8}
  .inset .sb line{stroke:#8794A2;stroke-width:1.5}
  .inset .sb text{fill:#8794A2;font-family:var(--mono);font-size:9px;letter-spacing:.1em}
  .inset .gs rect{fill:none;stroke:var(--truth);stroke-width:1.2}
  .inset .gs line{stroke:var(--truth);stroke-width:1.2}
  .rcap{position:absolute;bottom:18px;left:20px;z-index:5;font-family:var(--mono);font-size:10px;max-width:calc(100% - 360px);line-height:1.5;
        letter-spacing:.08em;text-transform:uppercase;color:var(--faint);text-shadow:0 1px 2px #000c,0 0 8px #0008}
  .stage:not(.env) .pane .rcap{bottom:46px}   /* map pane: clear the scale bar */
  .attrib{position:absolute;bottom:18px;left:20px;z-index:5;font-family:var(--mono);font-size:9.5px;
          letter-spacing:.04em;color:var(--faint);text-shadow:0 1px 2px #000c,0 0 8px #0008}
  .skl.gs{color:var(--truth);opacity:.9}
  .legend i.dash{border-top-style:dashed}
  .legend i.band{height:6px;border:0;background:#E8A21C33;outline:1px dashed #E8A21C;outline-offset:-1px}
  .march{animation:march .9s linear infinite}
  @keyframes march{to{stroke-dashoffset:-14}}
</style>

<script>
window.__fatal = function (msg) {
  var r = document.getElementById('root');
  if (!r) return;
  r.innerHTML = '<pre style="margin:0;min-height:100vh;padding:26px;background:#3d1f1f;'
    + 'color:#f0b3b0;white-space:pre-wrap;font:13px/1.6 ui-monospace,Menlo,monospace">'
    + 'CONSOLE FAILED TO START\n\n' + String(msg).replace(/</g, '&lt;') + '</pre>';
};
window.addEventListener('error', function (e) {
  window.__fatal((e.message || 'error') + '\n  at ' + (e.filename || '?') + ':' + (e.lineno || '?'));
});
window.addEventListener('unhandledrejection', function (e) {
  window.__fatal('unhandled rejection: ' + ((e.reason && e.reason.message) || e.reason));
});
setTimeout(function () {
  var r = document.getElementById('root');
  if (r && r.children.length === 0) {
    window.__fatal('React did not mount within 4s.\n\ntypeof React    = ' + (typeof React)
      + '\ntypeof ReactDOM = ' + (typeof ReactDOM)
      + '\ncreateRoot      = ' + (typeof (window.ReactDOM || {}).createRoot)
      + '\nTHREE           = ' + (typeof THREE) + '   Route = ' + (typeof window.Route)
      + '\nthree examples  = ' + ['GLTFLoader','DRACOLoader','RGBELoader','EffectComposer','RenderPass',
          'SSAOPass','UnrealBloomPass','ShaderPass','GammaCorrectionShader','SkeletonUtils','OrbitControls']
          .map(function (n) { return n + ':' + typeof ((window.THREE || {})[n]); }).join(' '));
  }
}, 4000);
</script>

<script type="module">
import htmMod from '/vendor/htm.js';
const {useState, useEffect, useRef} = React;
const html = htmMod.bind(React.createElement);

const QS = new URLSearchParams(window.location.search);
const VIEW = ['map', 'sky', 'split'].includes(QS.get('view')) ? QS.get('view') : 'env';
const ORBIT = QS.get('orbit') === '1';
const LOCK = QS.get('lock') === '1';     // ?lock=1: no user camera input (video capture)
// ?hz=N: refresh cadence of the numeric/text readouts -- strip digits and bars,
// displacement readout, HUD counts, timestamps, route metres. 0 = every epoch.
// The stream and the 3D scene are NOT affected: they take every epoch at the
// stream rate (design.md §5, 10-20/s) because SatLayer lerps satellite motion
// over the measured inter-epoch interval. Trust-state and credential changes
// bypass the cadence and land on the epoch they happen (see useThrottled).
// Why 3 Hz: a 2-decimal value has to hold still long enough to be read, and
// reading a 3-5 glyph token is one fixation plus a saccade, roughly 250-350 ms;
// a 333 ms hold is therefore the fastest cadence at which each value is legible
// before it is replaced (bench instruments settle on 2-4 readings/s for the
// same reason). At --rate 15 this is every 5th epoch. Measured (headless
// Chromium, --rate 15): unthrottled, the confidence digits changed 12-13x/s and
// the strip saw ~63 text mutations/s; at 3 Hz, ~3x/s and ~18/s, with the scene
// still taking all ~14/s and state changes still landing on their own epoch.
const DISPLAY_HZ_DEFAULT = 3;
const DISPLAY_HZ = QS.has('hz') && Number.isFinite(+QS.get('hz')) ? +QS.get('hz') : DISPLAY_HZ_DEFAULT;
const R = window.Route;                   // console/web/route.js -- mirrors console/mission.py

const COLOR = {NOMINAL:'var(--nominal)', DEGRADED:'var(--degraded)',
               RESTRICTED:'var(--restricted)', SURRENDERED:'var(--surrendered)'};
const BEHAVIOUR = {
  NOMINAL:'Full autonomy · accepting waypoints',
  DEGRADED:'Coasting on inertial · discrepancy flagged',
  RESTRICTED:'Current leg only · waypoints refused',
  SURRENDERED:'Holding position · operator has control',
};
const FEATURE_LABEL = {
  cn0_anomaly:'C/N0 anomaly', pseudorange_residual:'range residual',
  code_carrier_divergence:'code−carrier', cross_constellation:'cross-constel',
};
const niceStep = s => {
  const p = Math.pow(10, Math.floor(Math.log10(s))), n = s / p;
  return (n >= 5 ? 5 : n >= 2 ? 2 : 1) * p;
};

// Pane size in CSS px, so the SVG draws 1:1 and nothing is letterboxed or
// cropped when the map shares the stage with the dome.
function useSize(ref) {
  const [s, setS] = useState({w:0, h:0});
  useEffect(() => {
    const el = ref.current; if (!el) return;
    const ro = new ResizeObserver(([e]) => {
      const r = e.contentRect; setS({w:Math.round(r.width), h:Math.round(r.height)});
    });
    ro.observe(el);
    return () => ro.disconnect();
  }, [ref]);
  return s;
}

/* ---------------------------------------------------------------- frame math
   The route is a PRESENTATION FRAME: the receiver at USN8 is a static station.
     TRUE     = routePoint(s), s = epoch_index * speed        (scripted)
     BELIEVED = TRUE + D,  D = ENU(position) - ENU(_truth)    (measured)
   D is the only thing that separates the two tracks, and D comes from the
   stream. When the stream carries no displacement the tracks coincide. */
const dispOf = (m, ep) => {
  if (!m || !ep || !ep.position) return {e:0, n:0, mag:0, src:'none'};
  const t = ep._truth || m.surveyed;                 // no truth channel -> surveyed (static receiver)
  const b = R.latLonToEnu(m, ep.position.lat, ep.position.lon), tt = R.latLonToEnu(m, t.lat, t.lon);
  const e = b.e - tt.e, n = b.n - tt.n;
  return {e, n, mag:Math.hypot(e, n), src: ep._truth ? 'truth' : 'surveyed'};
};
const truePt = (m, i) => R.routePoint(m, i * m.speed_m_per_epoch);
const travelAz = headingRad => (90 - headingRad / D2R + 360) % 360;   // math angle -> compass azimuth
const norm2 = (x, y) => { const l = Math.hypot(x, y) || 1; return [x/l, y/l]; };
// Offset polyline (simple miter) for corridor edges. +hw = left of travel.
function offsetPolyline(pts, hw) {
  const out = [];
  for (let i = 0; i < pts.length; i++) {
    const p = pts[i], a = pts[Math.max(0, i-1)], b = pts[Math.min(pts.length-1, i+1)];
    const d1 = i > 0 ? norm2(p.e-a.e, p.n-a.n) : null, d2 = i < pts.length-1 ? norm2(b.e-p.e, b.n-p.n) : null;
    const t = d1 && d2 ? norm2(d1[0]+d2[0], d1[1]+d2[1]) : (d1 || d2);
    let m = 1; if (d1 && d2) m = 1 / Math.max(0.5, d1[0]*t[0] + d1[1]*t[1]);
    out.push({e: p.e - t[1]*hw*m, n: p.n + t[0]*hw*m});
  }
  return out;
}
// Ground uplink (TESLA mission authorisation, design.md §9) -- styled by the
// credential state. It comes from the GROUND station, never a satellite.
const UPLINK = {
  VALID:      {stroke:'var(--truth)',    dash:null,  cls:'',      frac:1,   op:.85},
  PENDING:    {stroke:'var(--truth)',    dash:'7 7', cls:'march', frac:1,   op:.85},  // key not yet disclosed
  UNVERIFIED: {stroke:'var(--degraded)', dash:'4 6', cls:'',      frac:1,   op:.85},
  EXPIRED:    {stroke:'var(--accent)',   dash:null,  cls:'',      frac:.45, op:.55},  // link broken
  REVOKED:    {stroke:'var(--accent)',   dash:null,  cls:'',      frac:.45, op:.55},
};

function Plot({trail, mission, size, credential}) {
  if (!mission || !size.w || !size.h) return html`<div className="idle">loading mission</div>`;
  const W = size.w, H = size.h, cx = W/2, cy = H/2, hw = mission.corridor_half_width_m;
  const last = trail.length ? trail[trail.length-1] : null;
  const T0 = last ? truePt(mission, last.i) : R.routePoint(mission, 0);
  const D = last ? dispOf(mission, last.ep) : {e:0, n:0, mag:0};
  // Frame follows the TRUE vehicle, north-up; widen as displacement grows.
  const span = Math.max(hw * 3.2, D.mag * 1.45, 18);       // metres, half-height
  const ppm = (H/2 - 40) / span;
  const XY = (e, n) => [cx + (e - T0.e)*ppm, cy - (n - T0.n)*ppm];
  const path = pts => pts.map((q, i) => { const [x, y] = XY(q.e, q.n); return `${i?'L':'M'}${x.toFixed(1)},${y.toFixed(1)}`; }).join(' ');
  const L = offsetPolyline(mission.route, hw), Rr = offsetPolyline(mission.route, -hw);
  const band = path(L) + ' ' + path([...Rr].reverse()).replace(/^M/, 'L') + ' Z';
  const tTrail = trail.map(p => truePt(mission, p.i));
  const bTrail = trail.map((p, k) => { const d = dispOf(mission, p.ep); return {e: tTrail[k].e + d.e, n: tTrail[k].n + d.n}; });
  const B = {e: T0.e + D.e, n: T0.n + D.n};
  const [tx, ty] = XY(T0.e, T0.n), [bx, by] = XY(B.e, B.n), [ox, oy] = XY(0, 0);
  const hd = T0.heading, hx = Math.cos(hd), hy = Math.sin(hd);
  const gs = mission.ground_station, [gx, gy] = XY(gs.e, gs.n);
  const up = UPLINK[credential] || UPLINK.VALID;
  const ux = gx + (tx - gx)*up.frac, uy = gy + (ty - gy)*up.frac;
  const inView = (x, y) => x > -30 && x < W + 30 && y > -30 && y < H + 30;
  const barM = niceStep(span*0.6), barPx = barM*ppm;
  const progress = Math.min(1, (last ? last.i * mission.speed_m_per_epoch : 0) / mission.route_length_m);

  return html`
    <svg viewBox="0 0 ${W} ${H}" width=${W} height=${H}>
      <defs>
        <pattern id="grat" width="50" height="50" patternUnits="userSpaceOnUse">
          <path d="M50 0 L0 0 0 50" fill="none" stroke="#161B21" strokeWidth="1"/>
        </pattern>
      </defs>
      <rect width=${W} height=${H} fill="url(#grat)"/>
      <path d=${band} fill="#E8A21C" fillOpacity=".07" stroke="none"/>
      <path d=${path(L)} fill="none" stroke="var(--degraded)" strokeWidth="1.2" strokeDasharray="9 6" opacity=".7"/>
      <path d=${path(Rr)} fill="none" stroke="var(--degraded)" strokeWidth="1.2" strokeDasharray="9 6" opacity=".7"/>
      <path d=${path(mission.route)} fill="none" stroke="#2B333D" strokeWidth="1"/>
      ${inView(ox, oy) && html`<g>
        <g stroke="var(--truth)" strokeWidth="2">
          <line x1=${ox-10} y1=${oy} x2=${ox+10} y2=${oy}/><line x1=${ox} y1=${oy-10} x2=${ox} y2=${oy+10}/>
        </g>
        <text x=${ox+14} y=${oy-12} fill="var(--truth)" fontSize="10" letterSpacing="1.3" fontFamily="var(--mono)">USN8 · RECEIVER (STATIC)</text>
      </g>`}
      ${inView(gx, gy) && html`<g>
        <rect x=${gx-6} y=${gy-6} width="12" height="12" fill="none" stroke="var(--truth)" strokeWidth="1.5"/>
        <line x1=${gx} y1=${gy-6} x2=${gx} y2=${gy-16} stroke="var(--truth)" strokeWidth="1.5"/>
        <text x=${gx+12} y=${gy+4} fill="var(--truth)" fontSize="10" letterSpacing="1.3" fontFamily="var(--mono)">GROUND STATION · AUTHORISATION</text>
      </g>`}
      <line className=${up.cls} x1=${gx} y1=${gy} x2=${ux} y2=${uy} stroke=${up.stroke} strokeWidth="1.5"
            strokeDasharray=${up.dash || 'none'} opacity=${up.op}/>
      <path d=${path(tTrail)} fill="none" stroke="var(--truth)" strokeWidth="2.5" opacity=".9"/>
      <path d=${path(bTrail)} fill="none" stroke="var(--accent)" strokeWidth="2.5"/>
      ${D.mag > 0.5 && html`<line x1=${tx} y1=${ty} x2=${bx} y2=${by} stroke="var(--accent)" strokeWidth="1" strokeDasharray="3 4" opacity=".65"/>`}
      <line x1=${tx} y1=${ty} x2=${tx + hx*16} y2=${ty - hy*16} stroke="var(--truth)" strokeWidth="2"/>
      <circle cx=${tx} cy=${ty} r="6.5" fill="var(--truth)"/>
      ${D.mag > 0.5 && html`<circle cx=${bx} cy=${by} r="6.5" fill="var(--accent)"/>`}
      <text x=${tx + 12} y=${ty + 18} fill="var(--truth)" fontSize="10" letterSpacing="1.3" fontFamily="var(--mono)">${D.mag > 0.5 ? 'TRUE · ROUTE FRAME' : 'TRUE = BELIEVED · NO MEASURED DISPLACEMENT'}</text>
      ${D.mag > 0.5 && html`<text x=${bx + 12} y=${by - 10} fill="var(--accent)" fontSize="10" letterSpacing="1.3" fontFamily="var(--mono)">BELIEVED · ${D.mag.toFixed(0)} M</text>`}
      <g transform=${`translate(24,${H-24})`}>
        <line x1="0" y1="0" x2=${barPx} y2="0" stroke="#8794A2" strokeWidth="2"/>
        <line x1="0" y1="-5" x2="0" y2="5" stroke="#8794A2" strokeWidth="2"/>
        <line x1=${barPx} y1="-5" x2=${barPx} y2="5" stroke="#8794A2" strokeWidth="2"/>
        <text x=${barPx/2} y="-11" fill="#8794A2" fontSize="11" textAnchor="middle" letterSpacing="1.4" fontFamily="var(--mono)">${barM} M</text>
        <text x=${barPx + 18} y="4" fill="#4E5A67" fontSize="10" letterSpacing="1.4" fontFamily="var(--mono)">NORTH UP · ROUTE ${(progress*100).toFixed(0)}%</text>
      </g>
    </svg>`;
}

/* ---------------------------------------------------------------- 3D sky
   Every element is real data from geometry.sky: satellite az/el propagated from
   broadcast ephemeris at USN8, and the trusted flag from the detector. Nothing
   decorative that could be read as a measurement. */
const D2R = Math.PI / 180;
// Scene frame, shared by the dome and the environment: x = East, y = Up,
// z = South (North is -z). az clockwise from N, so a satellite at az=90 sits
// at +x. The ground compass and the sky labels both derive from this one
// function, which is what keeps them in agreement.
const azel = (az, el) => {
  const a = az * D2R, e = el * D2R, c = Math.cos(e);
  return new THREE.Vector3(Math.sin(a) * c, Math.sin(e), -Math.cos(a) * c);
};
const approach = (a, b, s) => a + Math.max(-s, Math.min(s, b - a));
function glowTexture() {
  const c = document.createElement('canvas'); c.width = c.height = 64;
  const g = c.getContext('2d'), grd = g.createRadialGradient(32, 32, 0, 32, 32, 32);
  grd.addColorStop(0.00, 'rgba(255,255,255,1)');
  grd.addColorStop(0.16, 'rgba(255,255,255,0.9)');
  grd.addColorStop(0.42, 'rgba(255,255,255,0.16)');
  grd.addColorStop(1.00, 'rgba(255,255,255,0)');
  g.fillStyle = grd; g.fillRect(0, 0, 64, 64);
  return new THREE.CanvasTexture(c);
}
const SKY_TRUSTED = 0xA9CCEA, SKY_EXCLUDED = 0xE4551F, RAY_ALPHA = 0.34;

/* Satellite layer shared by SkyDome (radius 1, receiver at the origin) and
   EnvScene (radius 400 m, rays to the vehicle's antenna). One implementation, so
   the two views cannot drift apart in what they claim about the sky. */
class SatLayer {
  constructor(scene, labelBox, o) {
    const T = THREE;
    this.scene = scene; this.lab = labelBox;
    this.R = o.radius; this.center = o.center || new T.Vector3();
    this.target = o.target || this.center.clone();
    this.scale = o.scale; this.rayAlpha = o.rayAlpha;
    this.cls = o.labelCls || ''; this.fog = !!o.fog;
    this.tex = glowTexture(); this.sats = new Map();
    this.interval = 0; this.lastMsg = 0; this.tStart = performance.now();
  }
  pos(az, el) { return azel(az, el).multiplyScalar(this.R).add(this.center); }
  // new epoch -> new targets; positions lerp toward them over the measured
  // inter-epoch interval so motion is fluid at any replay rate
  setEpoch(sky) {
    const T = THREE, now = performance.now();
    if (this.lastMsg) { const dt = now - this.lastMsg;
      this.interval = this.interval ? this.interval*0.7 + dt*0.3 : dt; }
    this.lastMsg = now; this.tStart = now;
    const seen = new Set();
    for (const s of (sky || [])) {
      seen.add(s.sv);
      let r = this.sats.get(s.sv);
      if (!r) {
        const sprite = new T.Sprite(new T.SpriteMaterial({map:this.tex, transparent:true,
          blending:T.AdditiveBlending, depthWrite:false, opacity:0, fog:this.fog, toneMapped:false}));
        const geo = new T.BufferGeometry().setFromPoints([this.target.clone(), this.pos(s.az, s.el)]);
        const ln = new T.Line(geo, new T.LineBasicMaterial({color:SKY_TRUSTED, transparent:true,
          opacity:0, fog:this.fog, toneMapped:false}));
        const label = document.createElement('div'); label.className = 'skl ' + this.cls;
        label.textContent = s.sv; label.style.opacity = '0'; this.lab.appendChild(label);
        r = {sprite, line:ln, label, alpha:0, ray:0, vis:true,
             cur:{az:s.az, el:s.el}, prev:null, tgt:null};
        this.scene.add(sprite); this.scene.add(ln); this.sats.set(s.sv, r);
      }
      r.prev = {az:r.cur.az, el:r.cur.el}; r.tgt = {az:s.az, el:s.el};
      r.trusted = !!s.trusted; r.present = true;
    }
    for (const [id, r] of this.sats) if (!seen.has(id)) r.present = false;
  }
  // project(p) -> [x, y, visible]
  tick(dt, project) {
    const now = performance.now(), iv = this.interval || 70;
    const t = Math.min(1, (now - this.tStart) / iv), fade = dt / 0.5;   // 0.5 s fades
    const tg = this.target;
    for (const [id, r] of this.sats) {
      if (r.tgt) {
        const daz = ((r.tgt.az - r.prev.az + 540) % 360) - 180;
        r.cur.az = (r.prev.az + daz*t + 360) % 360;
        r.cur.el = r.prev.el + (r.tgt.el - r.prev.el)*t;
      }
      const p = this.pos(r.cur.az, r.cur.el);
      r.sprite.position.copy(p);
      const pa = r.line.geometry.attributes.position;
      pa.setXYZ(0, tg.x, tg.y, tg.z); pa.setXYZ(1, p.x, p.y, p.z); pa.needsUpdate = true;
      r.alpha = approach(r.alpha, r.present ? 1 : 0, fade);
      r.ray = approach(r.ray, (r.present && r.trusted) ? 1 : 0, fade);
      r.sprite.material.color.setHex(r.trusted ? SKY_TRUSTED : SKY_EXCLUDED);
      r.sprite.material.opacity = r.alpha * (r.trusted ? 1 : 0.62);
      r.sprite.scale.setScalar(r.trusted ? this.scale.trusted : this.scale.excluded);
      r.line.material.opacity = r.ray * this.rayAlpha;
      const pr = project(p);
      r.vis = pr[2]; r.lx = pr[0] + 9; r.ly = pr[1];
      r.label.style.opacity = (r.vis ? r.alpha : 0).toFixed(2);
      r.label.className = 'skl ' + this.cls + (r.trusted ? '' : ' x');
      if (!r.present && r.alpha <= 0) {
        this.scene.remove(r.sprite); this.scene.remove(r.line);
        r.sprite.material.dispose(); r.line.geometry.dispose(); r.line.material.dispose();
        r.label.remove(); this.sats.delete(id);
      }
    }
    // Labels of satellites that project close together get nudged apart so
    // both stay readable; sprites themselves are never moved.
    const ls = [...this.sats.values()].filter(r => r.alpha > 0 && r.vis).sort((a, b) => a.ly - b.ly);
    for (let i = 0; i < ls.length; i++) for (let j = 0; j < i; j++) {
      if (Math.abs(ls[i].lx - ls[j].lx) < 40 && ls[i].ly - ls[j].ly < 12) ls[i].ly = ls[j].ly + 12;
    }
    for (const r of ls) { r.label.style.left = r.lx + 'px'; r.label.style.top = r.ly + 'px'; }
    for (const [, r] of this.sats) if (!(r.alpha > 0 && r.vis)) { r.label.style.left = '0px'; r.label.style.top = '0px'; }
  }
  dispose() {
    for (const [, r] of this.sats) {
      r.label.remove(); this.scene.remove(r.sprite); this.scene.remove(r.line);
      r.sprite.material.dispose(); r.line.geometry.dispose(); r.line.material.dispose();
    }
    this.sats.clear(); this.tex.dispose();
  }
}

function SkyDome({sky, orbit}) {
  const box = useRef(null), lab = useRef(null), S = useRef(null);
  const [ok, setOk] = useState(typeof THREE !== 'undefined');

  useEffect(() => {
    const el = box.current;
    if (!el || typeof THREE === 'undefined') { setOk(false); return; }
    const T = THREE;
    const renderer = new T.WebGLRenderer({antialias:true, alpha:true});
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
    renderer.setClearColor(0x000000, 0);
    el.appendChild(renderer.domElement);
    const scene = new T.Scene();
    const cam = new T.PerspectiveCamera(34, 1, 0.05, 60);
    const st = {renderer, scene, cam, w:0, h:0, theta:-0.62, cmp:[]};
    st.layer = new SatLayer(scene, lab.current,
      {radius:1, scale:{trusted:0.082, excluded:0.064}, rayAlpha:RAY_ALPHA});
    S.current = st;

    const line = (pts, color, opacity=1) => new T.Line(
      new T.BufferGeometry().setFromPoints(pts),
      new T.LineBasicMaterial({color, transparent:true, opacity}));
    const ring = (elDeg, color) => {
      const pts = [], y = Math.sin(elDeg*D2R), r = Math.cos(elDeg*D2R);
      for (let i = 0; i <= 120; i++) { const a = i/120*2*Math.PI;
        pts.push(new T.Vector3(r*Math.sin(a), y, -r*Math.cos(a))); }
      return line(pts, color);
    };
    // graticule: horizon, 30°, 60° rings and meridian spokes every 30°
    scene.add(ring(0, 0x2B333D)); scene.add(ring(30, 0x1C222A)); scene.add(ring(60, 0x1C222A));
    for (let az = 0; az < 360; az += 30) {
      const pts = []; for (let i = 0; i <= 30; i++) pts.push(azel(az, i*3));
      scene.add(line(pts, 0x161B21));
    }
    // horizon disc
    const disc = new T.Mesh(new T.CircleGeometry(1, 120),
      new T.MeshBasicMaterial({color:0x0E1114, transparent:true, opacity:.9, side:T.DoubleSide}));
    disc.rotation.x = -Math.PI/2; disc.position.y = -0.003; scene.add(disc);
    // atmospheric rim: a radial alpha gradient, additive, in the --truth hue
    const rim = new T.Mesh(new T.RingGeometry(0.985, 1.46, 160, 1), new T.ShaderMaterial({
      transparent:true, depthWrite:false, blending:T.AdditiveBlending, side:T.DoubleSide,
      uniforms:{c:{value:new T.Color(0x7FA8CC)}},
      vertexShader:'varying vec2 vP; void main(){ vP=position.xy; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0); }',
      fragmentShader:'uniform vec3 c; varying vec2 vP; void main(){ float t=clamp((length(vP)-0.985)/0.475,0.0,1.0); float a=(1.0-t)*(1.0-t)*0.28; gl_FragColor=vec4(c*a,a); }',
    }));
    rim.rotation.x = -Math.PI/2; rim.position.y = -0.002; scene.add(rim);
    // receiver
    const rx = new T.Sprite(new T.SpriteMaterial({map:st.layer.tex, color:0xA9CCEA, transparent:true,
      blending:T.AdditiveBlending, depthWrite:false}));
    rx.scale.setScalar(0.07); rx.position.set(0, 0.004, 0); scene.add(rx);

    // compass labels (HTML, projected each frame)
    const mkLabel = (cls, text) => { const d = document.createElement('div');
      d.className = 'skl ' + cls; d.textContent = text; lab.current.appendChild(d); return d; };
    st.cmp = [['N',0],['E',90],['S',180],['W',270]].map(([t,az]) =>
      ({el: mkLabel('cmp', t), p: azel(az, -4).multiplyScalar(1.19)}));

    const place = () => {
      const w = st.w, h = st.h; if (!w || !h) return;
      const aspect = w / h; cam.aspect = aspect; cam.updateProjectionMatrix();
      // Frame for the horizon ring + compass labels (r~1.2), not the faint rim.
      const dist = Math.max(3.85, 4.1 / Math.max(0.5, aspect));
      const elv = 0.56;
      cam.position.set(dist*Math.cos(elv)*Math.sin(st.theta), dist*Math.sin(elv),
                       dist*Math.cos(elv)*Math.cos(st.theta));
      cam.lookAt(0, 0.20, 0);
    };
    let controls = null;
    if (!LOCK && typeof T.OrbitControls === 'function') {
      controls = new T.OrbitControls(cam, renderer.domElement);
      controls.enableDamping = true; controls.dampingFactor = 0.08; controls.target.set(0, 0.2, 0);
      controls.minDistance = 1.6; controls.maxDistance = 9; controls.maxPolarAngle = 1.5;
      controls.addEventListener('start', () => { st.userCam = true; });
    }
    const ro = new ResizeObserver(([e]) => {
      const w = Math.round(e.contentRect.width), h = Math.round(e.contentRect.height);
      if (w === st.w && h === st.h) return;          // zero-delta: leave the drawing buffer alone
      st.w = w; st.h = h;
      renderer.setSize(st.w, st.h, false);
      if (st.userCam) { cam.aspect = st.w/st.h; cam.updateProjectionMatrix(); } else place();
      // setSize re-allocates (clears) the drawing buffer. ResizeObserver callbacks
      // run after this frame's rAF and before paint, so repaint here or the
      // compositor presents the cleared canvas for one frame.
      renderer.render(scene, cam);
    });
    ro.observe(el);

    const v = new T.Vector3();
    const project = (p) => { v.copy(p).project(cam); return [(v.x+1)/2*st.w, (1-v.y)/2*st.h, true]; };
    let last = performance.now(), raf = 0;
    const loop = () => {
      const now = performance.now(), dt = Math.min(0.1, (now - last)/1000); last = now;
      st.layer.tick(dt, project);
      for (const c of st.cmp) { const [x, y] = project(c.p);
        c.el.style.left = x + 'px'; c.el.style.top = y + 'px'; }
      if (st.userCam && controls) controls.update();
      else if (orbit) { st.theta += 0.02*dt; place(); }
      renderer.render(scene, cam);
      raf = requestAnimationFrame(loop);
    };
    raf = requestAnimationFrame(loop);

    return () => {
      cancelAnimationFrame(raf); ro.disconnect();
      if (controls) controls.dispose();
      st.layer.dispose();
      for (const c of st.cmp) c.el.remove();
      renderer.dispose(); el.removeChild(renderer.domElement); S.current = null;
    };
  }, [orbit]);

  useEffect(() => { const st = S.current; if (st) st.layer.setEpoch(sky); }, [sky]);

  return html`
    <div className="sky" ref=${box}></div>
    <div className="skylabels" ref=${lab}></div>
    ${!ok && html`<div className="skyidle">3D unavailable — three.js did not load</div>`}
    ${ok && !(sky && sky.length) && html`<div className="skyidle">no sky geometry in stream</div>`}`;
}

/* ---------------------------------------------------------- 3D environment
   A rendered scene, not a sensor. What is data: the solid vehicle at USN8's
   surveyed position, the ghost at the believed position (real displacement in
   metres from /mission's scale), the alert ring, and every satellite overhead
   with its line of sight to the antenna. What is illustrative: terrain, sky,
   and the vehicle model itself. The on-screen caption says exactly that
   (design.md §11b), and the attribution line names the asset sources. */

// Deterministic noise: the terrain renders identically on every machine and
// every take, so frames are comparable between beats.
const mulberry32 = a => () => { a |= 0; a = a + 0x6D2B79F5 | 0;
  let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
  return ((t ^ t >>> 14) >>> 0) / 4294967296; };
function makeNoise(seed) {

      key.target.position.copy(st.truePos); key.target.updateMatrixWorld();
      // -- sky: dome re-centred on the vehicle; rays follow st.antW (shared vector) -
      dome.position.copy(st.truePos);
      st.layer.tick(dt, project);
      for (const c of st.cmp) { c.p.copy(c.base).add(st.truePos); putLabel(c); }
      putLabel(st.lblTruth); putLabel(st.lblGS);
      if (show) {
        const [gx, gy, gvis] = project(st.lblGhost.p);
        if (gvis) { st.lblGhost.el.style.left = gx + 'px'; st.lblGhost.el.style.top = gy + 'px'; st.lblGhost.el.style.opacity = 1;
          st.lblGhost.el.textContent = st.lblGhost.base; }
        else {
          // ghost is off-frame (or behind): pin its label to the frame edge in its direction
          const [tx, ty] = project(st.antW); let dx = gx - tx, dy = gy - ty;
          if (tv.copy(st.lblGhost.p).sub(cam.position).dot(camFwd) < 0) { dx = -dx; dy = -dy; }
          const L = Math.hypot(dx, dy) || 1; dx /= L; dy /= L;
          const M = 28, ex = Math.max(M, Math.min(st.w - 170, tx + dx*4000)), ey = Math.max(M, Math.min(st.h - M, ty + dy*4000));
          const arrow = Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? ' →' : '← ') : (dy > 0 ? ' ↓' : ' ↑');
          st.lblGhost.el.style.left = ex + 'px'; st.lblGhost.el.style.top = ey + 'px'; st.lblGhost.el.style.opacity = 1;
          st.lblGhost.el.textContent = (dx < 0 && Math.abs(dx) > Math.abs(dy) ? arrow : '') + st.lblGhost.base + ' · OFF FRAME' + (dx < 0 && Math.abs(dx) > Math.abs(dy) ? '' : arrow);
        }
      }
      if (st.inset.dirty) st.inset.render();               // once, then only when an asset arrives
      draw(); st.frames = (st.frames || 0) + 1;
      raf = requestAnimationFrame(loop);
    };
    // faint dome graticule, grouped so it can follow the vehicle
    const dome = new T.Group(); scene.add(dome);
    const gline = (pts, op) => new T.Line(new T.BufferGeometry().setFromPoints(pts),
      new T.LineBasicMaterial({color:0x1C222A, transparent:true, opacity:op, fog:false, toneMapped:false}));
    for (const elv of [0.6, 30, 60]) { const pts = [];
      for (let i = 0; i <= 160; i++) pts.push(azel(i/160*360, elv).multiplyScalar(ENV.R));
      dome.add(gline(pts, elv < 1 ? 0.7 : 0.45)); }
    for (let a2 = 0; a2 < 360; a2 += 30) { const pts = [];
      for (let i = 0; i <= 30; i++) pts.push(azel(a2, 0.6 + i*2.98).multiplyScalar(ENV.R));
      dome.add(gline(pts, 0.35)); }
    raf = requestAnimationFrame(loop);

    return () => {
      alive = false;
      cancelAnimationFrame(raf); ro.disconnect(); st.layer.dispose();
      if (controls) controls.dispose();
      for (const c of st.cmp) c.el.remove();
      st.lblTruth.el.remove(); st.lblGhost.el.remove(); st.lblGS.el.remove();
      scene.traverse(o => { if (o.geometry) o.geometry.dispose();
        if (o.material) (Array.isArray(o.material) ? o.material : [o.material]).forEach(mm => mm.dispose()); });
      if (scene.environment) scene.environment.dispose();
      if (scene.background && scene.background.dispose) scene.background.dispose();
      if (composer) composer.dispose && composer.dispose();
      if (st.inset) st.inset.rt.dispose();
      delete window.__envProject; delete window.__envInfo; delete window.__envDrag; delete window.__insetInfo;
      renderer.dispose(); el.removeChild(renderer.domElement); S.current = null;
    };
  }, [orbit]);

  useEffect(() => { const st = S.current; if (st) st.layer.setEpoch(sky); }, [sky]);
  // per-epoch targets: route arc length s and the measured displacement D
  useEffect(() => {
    const st = S.current; if (!st || !mission || epochIndex == null) return;
    st.lastEpoch = epochIndex; st.sPrev = st.sTgt; st.sTgt = epochIndex * mission.speed_m_per_epoch;
    st.gPrev.copy(st.gTgt); st.gTgt.set(D ? D.e : 0, 0, D ? -D.n : 0); st.Dmag = D ? D.mag : 0;
    // Written here, on the epoch event, so it can never disagree with the readout
    // (the rAF loop can starve on slow renderers; the DOM update must not depend on it).
    st.lblGhost.base = 'BELIEVED · ' + st.Dmag.toFixed(0) + ' M'; st.lblGhost.el.textContent = st.lblGhost.base;
    st.T0 = performance.now();
  }, [epochIndex]);
  useEffect(() => { const st = S.current; if (st) st.cred = credential || 'VALID'; }, [credential]);

  return html`
    <div className="sky" ref=${box}></div>
    <div className="skylabels" ref=${lab}></div>
    ${ok && html`<div className="inset">
      <div className="map" ref=${insMap}>
        <canvas ref=${insCv}></canvas>
        <svg ref=${insSvg}><g className="sb"></g><g className="gs"></g>
          <line ref=${insLink} className="link" style=${{display:'none'}}/>
          <path ref=${insT} className="pin t" d=${PIN_D}/>
          <path ref=${insB} className="pin b" d=${PIN_D} style=${{display:'none'}}/>
        </svg>
      </div>
      <div className="cap"><b>Satellite view</b> · rendered · north up</div>
    </div>`}
    ${!ok && html`<div className="skyidle">3D unavailable — three.js did not load</div>`}`;
}

function Authority({state}) {
  return html`
    <div className="cell c-auth">
      <div className="lbl">Positional authority</div>
      <div className="state" style=${{color:COLOR[state]}}>${state}</div>
      <div className="sub">${BEHAVIOUR[state]}</div>
    </div>`;
}

function Confidence({conf, credential, thresholds, state}) {
  return html`
    <div className="cell c-conf">
      <div className="lbl">Position confidence</div>
      <div className="bigrow">
        <div className="conf" style=${{color: conf != null ? COLOR[state] : 'var(--faint)'}}>
          ${conf != null ? conf.toFixed(2) : '—'}</div>
        ${credential && html`<div className="cred">credential ${credential}</div>`}
      </div>
      <div className="bar">
        <span style=${{width:((conf||0)*100)+'%', background:COLOR[state]}}></span>
        ${Object.entries(thresholds || {}).map(([k,v]) =>
          html`<i className="tick" key=${k} style=${{left:(v*100)+'%'}}></i>`)}
      </div>
    </div>`;
}

function Features({features}) {
  // Rows are always rendered so the strip height never depends on content.
  // CLAUDE.md: the composite is never shown without these four alongside it.
  return html`
    <div className="cell c-feat">
      <div className="lbl">Which signal diverged</div>
      <div className="frows">
        ${Object.keys(FEATURE_LABEL).map(k => {
          const v = features && typeof features[k] === 'number' ? features[k] : null;
          return html`
            <div className="frow" key=${k}>
              <div className="n">${FEATURE_LABEL[k]}</div>
              <div className="fb"><span style=${{
                width: v == null ? '0%' : (v*100).toFixed(1)+'%',
                background: v != null && v > .45 ? 'var(--accent)' : 'var(--faint)'}}></span></div>
              <div className="v">${v == null ? '—' : v.toFixed(2)}</div>
            </div>`;
        })}
      </div>
    </div>`;
}

function Geometry({geometry, divergence, tracked}) {
  const g = geometry || {};
  const drift = divergence && divergence.ratio_delta != null ? divergence.ratio_delta : null;
  return html`
    <div className="cell c-geom">
      <div className="lbl">Trusted geometry</div>
      <div className="geo">
        <div className="boundwrap">
          <div className=${'bound' + (g.displacement_bound_m != null ? '' : ' none')}>
            ${g.displacement_bound_m != null ? g.displacement_bound_m.toFixed(0) : '—'}</div>
          <div className="boundlbl">m displacement bound</div>
        </div>
        <div className="geokv">
          <div className="kv"><span>information ratio</span>
            <b>${g.information_ratio != null ? g.information_ratio.toFixed(3) : '—'}</b></div>
          <div className="kv"><span>satellites tracked</span><b>${tracked ?? '—'}</b></div>
          <div className="kv"><span>next best observation</span>
            <b>${g.next_best_observation || '—'}</b></div>
          <div className="kv"><span>drift from last trusted</span>
            <b>${drift != null ? drift.toFixed(3) : '—'}</b></div>
        </div>
      </div>
    </div>`;
}

function Dropped({geometry}) {
  // Its own cell with a hard floor wide enough for three chips per row, so the
  // six-satellite attack case wraps to two rows instead of clipping.
  const ex = (geometry || {}).excluded_sv || [];
  return html`
    <div className="cell c-drop">
      <div className="lbl">Dropped from trusted set</div>
      <div className="sv">
        ${ex.length
          ? ex.map(s => html`<span key=${s}>${s}</span>`)
          : html`<span className="none">none</span>`}
      </div>
    </div>`;
}

// Hold `value` and republish it at most every 1/hz s. The latest value is always
// the one that lands (trailing flush), so the display trails the stream by at
// most one interval and never sticks on a stale epoch when the stream ends.
// A change in `flushKey` publishes immediately and restarts the interval: that
// is how a trust-state or credential transition is never delayed for the sake
// of the cadence. hz <= 0 passes every value through.
function useThrottled(value, hz, flushKey) {
  const [shown, setShown] = useState(value);
  const latest = useRef(value); latest.current = value;
  const last = useRef(-Infinity), timer = useRef(null), lastKey = useRef(flushKey);
  useEffect(() => {
    const force = flushKey !== lastKey.current; lastKey.current = flushKey;
    const wait = hz > 0 && !force ? last.current + 1000 / hz - performance.now() : 0;
    if (wait <= 0) {
      clearTimeout(timer.current); timer.current = null;
      last.current = performance.now(); setShown(value); return;
    }
    if (timer.current) return;                 // a trailing flush is already scheduled
    timer.current = setTimeout(() => {
      timer.current = null; last.current = performance.now(); setShown(latest.current);
    }, wait);
  }, [value, hz, flushKey]);
  useEffect(() => () => clearTimeout(timer.current), []);
  return shown;
}

function App() {
  const [d, setD] = useState(null);
  const [trail, setTrail] = useState([]);
  const [conn, setConn] = useState('connecting');
  const [mission, setMission] = useState(null);
  const [envStatus, setEnvStatus] = useState({note:'loading vehicle model · loading sky', attrib:ENV.attribNoModel});
  const mapRef = useRef(null);
  const mapSize = useSize(mapRef);

  useEffect(() => {
    fetch('/mission').then(r => r.json()).then(setMission).catch(() => {});
  }, []);

  useEffect(() => {
    const src = new EventSource('/events' + window.location.search);
    src.onopen = () => setConn('live');
    src.onmessage = e => {
      const m = JSON.parse(e.data);
      setD(m);
      // Trail keeps only what the frame math needs: epoch index (-> s along the
      // route) and the believed/true pair (-> measured displacement D).
      if (m.position) setTrail(t => [...t.slice(-2400),
        {i:m.epoch_index, ep:{position:m.position, _truth:m._truth}}]);
    };
    src.addEventListener('end', () => { setConn('ended'); src.close(); });
    src.onerror = () => setConn(src.readyState === 2 ? 'lost' : 'connecting');
    return () => src.close();
  }, []);

  useEffect(() => {
    const k = e => { if (e.key === 'r' || e.key === 'R') window.location.reload(); };
    window.addEventListener('keydown', k);
    return () => window.removeEventListener('keydown', k);
  }, []);

  // Two views of the stream. `d` is the latest epoch and drives everything that
  // must move on the epoch it happens: trust state, credential, layer badge,
  // banners, explanation, and the 3D scene (which lerps between epochs and
  // needs every one). `s` is the same object sampled at DISPLAY_HZ for the
  // digits, so the composite confidence, the four sub-scores, the geometry
  // block, the dropped set and the HUD counts are always read from ONE epoch
  // (never mixed) and hold still long enough to be read. `s` trails `d` by at
  // most one display interval, except on a state/credential/layer change,
  // where it is republished on that very epoch.
  const state = d ? d.state : 'NOMINAL';
  const layerOn = !d || d.layer_on;
  const s = useThrottled(d, DISPLAY_HZ, d ? `${d.state}|${d.credential_status}|${d.layer_on}` : '');
  const sky = d && d.geometry && d.geometry.sky;
  // layer=off is about the signal side; the credential channel is drawn static VALID.
  const credShown = layerOn ? (d && d.credential_status) || 'VALID' : 'VALID';
  // Scene displacement, full rate: the ghost lerps its position toward it and
  // EnvScene writes its own 'BELIEVED · N M' label from it on every epoch.
  const D = dispOf(mission, d);

  // Display snapshot. The readout number and its 'beyond alert limit' caption
  // come from the same sampled epoch so the digits never contradict the caption.
  // The in-scene ghost label can lead the readout by up to one display interval
  // (it rides with the ghost, which must move every epoch); accepted.
  const conf = s && s.confidence != null ? s.confidence : null;
  const sSky = s && s.geometry && s.geometry.sky;
  const nTrusted = sSky ? sSky.filter(x => x.trusted).length : 0;
  const nExcl = sSky ? sSky.length - nTrusted : 0;
  const sep = dispOf(mission, s).mag;
  const breached = mission && sep > mission.alert_limit_m;
  const ts = s && s.timestamp ? s.timestamp.slice(11,19) + ' UTC' : '—';
  const routeM = mission && s ? Math.min(mission.route_length_m, s.epoch_index * mission.speed_m_per_epoch) : 0;
  const showMap = VIEW === 'map' || VIEW === 'split', showSky = VIEW === 'sky' || VIEW === 'split';
  const showEnv = VIEW === 'env';
  const orbitHint = (showEnv || showSky) && !LOCK ? 'drag to orbit · ' : '';

  return html`
    <div className="banners">
      ${d && d.synthetic && html`<div className="banner synthetic">
        Synthetic stream — not measured data — replace with Track A output before recording
      </div>`}
      ${d && d.threshold_provenance === 'PLACEHOLDER' && html`<div className="banner provenance">
        Thresholds are placeholders — replace with measured separation points (design.md §10)
      </div>`}
      ${conn === 'lost' && html`<div className="banner unverified">
        Stream disconnected — this display is stale — press R to reconnect
      </div>`}
      ${d && d.explanation_verified === false && html`<div className="banner unverified">
        Explanation claim failed verification — numeric detail withheld
      </div>`}
    </div>

    <div className="strip">
      <${Authority} state=${state}/>
      ${/* state and credential are immediate (d); every number is from the one
           sampled epoch (s). Bar and digit colour follow the state the instant
           it changes; the snapshot is republished on that same epoch. */ null}
      <${Confidence} conf=${conf} credential=${d && d.credential_status}
                     thresholds=${s && s.thresholds} state=${state}/>
      <${Features} features=${s && s.features}/>
      <${Geometry} geometry=${s && s.geometry} divergence=${s && s.geometry_divergence}
                   tracked=${s && s.satellites_tracked}/>
      <${Dropped} geometry=${s && s.geometry}/>
    </div>

    <div className=${'stage' + (showEnv ? ' env' : '')}>
      ${showEnv && html`
        <div className="pane">
          ${mission
            ? html`<${EnvScene} sky=${sky} epochIndex=${d ? d.epoch_index : null} D=${D} mission=${mission}
                                orbit=${ORBIT} onStatus=${setEnvStatus} credential=${credShown}/>`
            : html`<div className="idle">loading mission</div>`}
          <div className="rcap">Rendered scene · route and motion are a presentation frame; the receiver is static · position divergence and satellites are from data · terrain and vehicle model illustrative</div>
          <div className="attrib">${envStatus.attrib}</div>
        </div>`}
      ${showMap && html`
        <div className="pane" ref=${mapRef}>
          <${Plot} trail=${trail} mission=${mission} size=${mapSize} credential=${credShown}/>
          <div className="legend">
            <div><i style=${{borderColor:'var(--truth)'}}></i>true · route frame</div>
            <div><i style=${{borderColor:'var(--accent)'}}></i>believed · true + measured displacement</div>
            <div><i className="band"></i>corridor · alert limit ${mission ? mission.corridor_half_width_m : '—'} m half-width</div>
            <div><i className="dash" style=${{borderColor:'var(--truth)'}}></i>ground uplink · mission authorisation</div>
          </div>
          <div className="rcap">Route and motion are a presentation frame · the receiver is static · divergence is measured</div>
        </div>`}
      ${showSky && html`
        <div className="pane">
          <${SkyDome} sky=${sky} orbit=${ORBIT}/>
          <div className="skycap" style=${{top: showMap ? '18px' : '120px'}}>
            Sky from USN8 · GPS + Galileo
            <div className="n2"><b>${nTrusted}</b> trusted · <b>${nExcl}</b> excluded
              · real ephemeris, ${ts}</div>
          </div>
          <div className="skyleg">
            <div><i style=${{background:'#A9CCEA'}}></i>trusted · line of sight kept</div>
            <div><i style=${{background:'var(--accent)'}}></i>excluded · line of sight dropped</div>
          </div>
        </div>`}
      <div className="readout">
        <div className=${'n' + (breached ? '' : ' safe')}>${sep.toFixed(0)}<span
          style=${{fontSize:'22px',marginLeft:'6px'}}>m</span></div>
        <div className="u">${breached ? 'beyond alert limit' : 'measured displacement'}</div>
      </div>
      <div className=${'layer kbox' + (layerOn ? '' : ' off')}>
        Trust layer <b>${layerOn ? 'ON' : 'OFF'}</b></div>
      <div className="hint">
        ${conn === 'ended' ? 'replay complete · ' : ''}${conn === 'connecting' ? 'connecting · ' : ''}${orbitHint}press R to reset
      </div>
    </div>

    <div className=${'expbar' + (showEnv ? ' env' : '')}>
      <div className="h">${d && d.explanation ? d.explanation.headline : ''}</div>
      <div className="d">${d && d.explanation ? d.explanation.detail : ''}</div>
      ${showEnv && html`<div className="expkey">
        <div className="keys">
          <div><i style=${{background:'#8A857A'}}></i>solid · true (route frame)</div>
          <div><i className="gh"></i>ghost · believed = true + measured displacement</div>
          <div><i style=${{background:'#A9CCEA'}}></i>satellite links · ranging (position)</div>
          <div><i style=${{background:'var(--accent)'}}></i>excluded satellite · link dropped</div>
          <div><i style=${{background:'none',borderTop:'2px solid #A9CCEA',height:0}}></i>ground uplink · TESLA mission authorisation (authority)</div>
        </div>
        <div className="n2"><b>${nTrusted}</b> trusted · <b>${nExcl}</b> excluded · real ephemeris, ${ts}</div>
        <div className="n2">route <b>${routeM.toFixed(0)}</b> / ${mission ? mission.route_length_m.toFixed(0) : '—'} m
          ${mission && sep < 0.5 && html`<span className="st" style=${{color:'var(--truth)'}}> · believed = true · no measured displacement</span>`}
          ${envStatus.note && html`<span className="st"> · ${envStatus.note}</span>`}
        </div>
      </div>`}
    </div>`;
}

ReactDOM.createRoot(document.getElementById('root')).render(html`<${App}/>`);
</script>
