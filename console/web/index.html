<style>

     font-display:block avoids a flash of fallback metrics mid-capture. */

  @font-face{font-family:'IBM Plex Sans';font-weight:500;font-display:block;

  @font-face{font-family:'IBM Plex Sans';font-weight:700;font-display:block;

  @font-face{font-family:'IBM Plex Mono';font-weight:500;font-display:block;

  :root{
    --bg:#0B0D0F; --panel:#0E1114; --line:#1C222A; --keyline:#2B333D;
    --fg:#EEF2F6; --dim:#8794A2; --faint:#4E5A67;
    --accent:#E4551F;
    --nominal:#D8E2EC; --degraded:#E8A21C; --restricted:#E4551F; --surrendered:#D62119;
    --believed:#E4551F; --truth:#7FA8CC;
    /* Three tiers, deliberately: condensed-black for display numbers, Plex Sans
       for prose and labels, Plex Mono for aligned instrument data. */
    --display:"Helvetica Neue","Arial Narrow",Impact,system-ui,sans-serif;
    --sans:'IBM Plex Sans','Inter',system-ui,sans-serif;
    --mono:'IBM Plex Mono',ui-monospace,"SF Mono",Menlo,monospace;

  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{background:var(--bg);color:var(--fg);font:13px/1.5 var(--sans);
       -webkit-font-smoothing:antialiased;overflow:hidden}
  #root{height:100vh;display:flex;flex-direction:column}
  .banners{flex:0 0 auto}
  .banner{padding:8px 20px;font-size:11px;letter-spacing:.14em;text-transform:uppercase;

  .banner.synthetic{background:var(--surrendered);color:#fff}
  .banner.provenance{background:#2A2410;color:var(--degraded);
                     border-bottom:1px solid #453A18}
  .banner.unverified{background:var(--surrendered);color:#fff}

  /* ---- horizontal instrument strip -------------------------------------
     Fixed height on purpose: the stage below must start at the same y in
     every configuration, so the Trust layer badge is pixel-identical
     between layer=on and layer=off (design.md §11b). */
  .strip{flex:0 0 auto;height:156px;display:flex;
         border-bottom:1px solid var(--keyline);background:var(--panel)}
  .cell{padding:13px 17px;border-right:1px solid var(--line);min-width:0;
        display:flex;flex-direction:column;overflow:hidden}
  .cell:last-child{border-right:0}
  /* flex-basis sets the comfortable width, min-width the hard floor. Floors sum
     to ~1275px so nothing clips down to a 1280 viewport. */
  .c-auth{flex:0 1 330px;min-width:268px}
  .c-conf{flex:1 1 250px;min-width:186px}
  .c-feat{flex:1 1 380px;min-width:220px}
  .c-geom{flex:1 1 430px;min-width:404px}
  .c-drop{flex:0 0 196px;min-width:196px}
  .lbl{font-family:var(--sans);font-weight:600;font-size:10px;letter-spacing:.16em;
     color:var(--faint);text-transform:uppercase;margin-bottom:9px;white-space:nowrap}
  .state{font-family:var(--display);font-weight:900;font-size:40px;line-height:.94;

  .sub{font-family:var(--sans);font-size:12.5px;color:var(--dim);margin-top:8px;
     line-height:1.4}
  .conf{font-family:var(--display);font-weight:900;font-size:40px;line-height:1;
        letter-spacing:-.02em;font-variant-numeric:tabular-nums}
  .bigrow{display:flex;align-items:baseline;gap:11px;flex-wrap:wrap}
  .cred{font-family:var(--sans);font-weight:500;font-size:10px;letter-spacing:.12em;

  .bar{height:8px;background:#171C22;position:relative;margin-top:13px;

  .bar>span{position:absolute;left:0;top:0;bottom:0}
  .tick{position:absolute;top:-3px;bottom:-3px;width:1px;background:var(--faint)}

  .idle{display:flex;height:100%;align-items:center;justify-content:center;

  /* sky dome */
  .sky{position:absolute;inset:0}
  .sky canvas{display:block;width:100%;height:100%}
  .skylabels{position:absolute;inset:0;pointer-events:none;overflow:hidden}

  .skl.x{color:var(--accent)}
  .skl.cmp{font-family:var(--sans);font-weight:600;font-size:11px;letter-spacing:.16em;
           color:var(--dim);transform:translate(-50%,-50%)}
  .skycap{position:absolute;left:20px;z-index:5;font-family:var(--sans);font-weight:600;

  .skycap .n2{font-family:var(--mono);font-weight:400;font-size:10px;color:var(--faint);
              margin-top:5px;letter-spacing:.02em;text-transform:none}
  .skycap .n2 b{color:var(--fg);font-weight:500}
  .skyleg{position:absolute;bottom:18px;left:20px;z-index:5;font-family:var(--sans);

          color:var(--dim)}
  .skyleg div{display:flex;align-items:center;gap:9px;margin-top:6px}
  .skyleg i{width:8px;height:8px;display:inline-block}
  .skyidle{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
           font-family:var(--sans);font-weight:500;color:var(--faint);font-size:11px;
           letter-spacing:.16em;text-transform:uppercase;pointer-events:none}

  /* ---- explanation, full width so it is never clipped ----------------- */
  .expbar{flex:0 0 auto;border-top:1px solid var(--keyline);background:#0A0C0E;
          padding:15px 24px;display:grid;grid-template-columns:minmax(260px,26%) 1fr;
          gap:30px;align-items:start}

           letter-spacing:-.005em}

window.__fatal = function (msg) {
  var r = document.getElementById('root');
  if (!r) return;
  r.innerHTML = '<pre style="margin:0;min-height:100vh;padding:26px;background:#3d1f1f;'
    + 'color:#f0b3b0;white-space:pre-wrap;font:13px/1.6 ui-monospace,Menlo,monospace">'
    + 'CONSOLE FAILED TO START\n\n' + String(msg).replace(/</g, '&lt;') + '</pre>';
};
window.addEventListener('error', function (e) {
  window.__fatal((e.message || 'error') + '\n  at ' + (e.filename || '?') + ':' + (e.lineno || '?'));
});
window.addEventListener('unhandledrejection', function (e) {
  window.__fatal('unhandled rejection: ' + ((e.reason && e.reason.message) || e.reason));
});
setTimeout(function () {
  var r = document.getElementById('root');
  if (r && r.children.length === 0) {
    window.__fatal('React did not mount within 4s.\n\ntypeof React    = ' + (typeof React)
      + '\ntypeof ReactDOM = ' + (typeof ReactDOM)
      + '\ncreateRoot      = ' + (typeof (window.ReactDOM || {}).createRoot));
  }
}, 4000);
</script>

<script type="module">
import htmMod from '/vendor/htm.js';
const {useState, useEffect, useRef} = React;
const html = htmMod.bind(React.createElement);

const QS = new URLSearchParams(window.location.search);
const VIEW = ['map', 'sky'].includes(QS.get('view')) ? QS.get('view') : 'split';
const ORBIT = QS.get('orbit') === '1';

const COLOR = {NOMINAL:'var(--nominal)', DEGRADED:'var(--degraded)',
               RESTRICTED:'var(--restricted)', SURRENDERED:'var(--surrendered)'};
const BEHAVIOUR = {
  NOMINAL:'Full autonomy · accepting waypoints',
  DEGRADED:'Coasting on inertial · discrepancy flagged',
  RESTRICTED:'Current leg only · waypoints refused',
  SURRENDERED:'Holding position · operator has control',
};
const FEATURE_LABEL = {
  cn0_anomaly:'C/N0 anomaly', pseudorange_residual:'range residual',
  code_carrier_divergence:'code−carrier', cross_constellation:'cross-constel',
};
const niceStep = s => {
  const p = Math.pow(10, Math.floor(Math.log10(s))), n = s / p;
  return (n >= 5 ? 5 : n >= 2 ? 2 : 1) * p;
};

// Pane size in CSS px, so the SVG draws 1:1 and nothing is letterboxed or
// cropped when the map shares the stage with the dome.
function useSize(ref) {
  const [s, setS] = useState({w:0, h:0});
  useEffect(() => {
    const el = ref.current; if (!el) return;
    const ro = new ResizeObserver(([e]) => {
      const r = e.contentRect; setS({w:Math.round(r.width), h:Math.round(r.height)});
    });
    ro.observe(el);
    return () => ro.disconnect();
  }, [ref]);
  return s;
}

function Plot({trail, mission, sep, size}) {
  if (!mission || !size.w || !size.h) return html`<div className="idle">loading mission</div>`;
  const W = size.w, H = size.h, cx = W/2, cy = H/2;
  const AL = mission.alert_limit_m;
  // Frame on the surveyed point; expand as displacement grows so the alert ring
  // is always legible and the plot never sits in a void.
  const span = Math.max(AL * 2.6, (sep || 0) * 1.45, 12);   // metres, half-height
  const ppm = (H/2 - 40) / span;
  const toXY = p => {
    const dN = (p.lat - mission.surveyed.lat) * mission.m_per_deg_lat;
    const dE = (p.lon - mission.surveyed.lon) * mission.m_per_deg_lon;
    return [cx + dE*ppm, cy - dN*ppm];
  };
  // Rings out to whatever fits horizontally with room for the label.
  const step = niceStep(span*0.7), rings = [], maxR = (W/2 - 64) / ppm;
  for (let r = step; r <= maxR; r += step) rings.push(r);
  const path = trail.filter(p=>p.b).map((p,i)=>{
    const [x,y] = toXY(p.b); return `${i?'L':'M'}${x.toFixed(1)},${y.toFixed(1)}`;
  }).join(' ');
  const last = trail.length ? trail[trail.length-1] : null;
  const bxy = last && last.b ? toXY(last.b) : null;
  const barM = niceStep(span*0.6), barPx = barM*ppm;

  return html`
    <svg viewBox="0 0 ${W} ${H}" width=${W} height=${H}>
      <defs>
        <pattern id="grat" width="50" height="50" patternUnits="userSpaceOnUse">
          <path d="M50 0 L0 0 0 50" fill="none" stroke="#161B21" strokeWidth="1"/>
        </pattern>
      </defs>
      <rect width=${W} height=${H} fill="url(#grat)"/>
      <line x1="0" y1=${cy} x2=${W} y2=${cy} stroke="#1C222A"/>
      <line x1=${cx} y1="0" x2=${cx} y2=${H} stroke="#1C222A"/>
      ${rings.map(r => html`<g key=${r}>
        <circle cx=${cx} cy=${cy} r=${r*ppm} fill="none" stroke="#1C222A"
                strokeDasharray="2 5"/>
        <text x=${cx + r*ppm + 5} y=${cy - 5} fill="#4E5A67" fontSize="11"
              fontFamily="var(--mono)">${r} m</text>
      </g>`)}
      <circle cx=${cx} cy=${cy} r=${AL*ppm} fill="none" stroke="var(--degraded)"
              strokeWidth="1.5" strokeDasharray="9 6" opacity=".75"/>
      <text x=${cx + AL*ppm*0.74} y=${cy - AL*ppm*0.74} fill="var(--degraded)"
            fontSize="12" letterSpacing="1.6" fontFamily="var(--mono)">
        ALERT LIMIT ${AL} M
      </text>
      ${bxy && html`<line x1=${cx} y1=${cy} x2=${bxy[0]} y2=${bxy[1]}
                          stroke="var(--accent)" strokeWidth="1" strokeDasharray="3 4"
                          opacity=".65"/>`}
      <path d=${path} fill="none" stroke="var(--accent)" strokeWidth="2.5"/>
      <g stroke="var(--truth)" strokeWidth="2">
        <line x1=${cx-11} y1=${cy} x2=${cx+11} y2=${cy}/>
        <line x1=${cx} y1=${cy-11} x2=${cx} y2=${cy+11}/>
      </g>
      <text x=${cx-20} y=${cy-19} fill="var(--truth)" fontSize="11" letterSpacing="1.4"
            textAnchor="end" fontFamily="var(--mono)">USN8 SURVEYED</text>
      ${bxy && html`<circle cx=${bxy[0]} cy=${bxy[1]} r="7" fill="var(--accent)"/>`}
      <g transform=${`translate(24,${H-24})`}>
        <line x1="0" y1="0" x2=${barPx} y2="0" stroke="#8794A2" strokeWidth="2"/>
        <line x1="0" y1="-5" x2="0" y2="5" stroke="#8794A2" strokeWidth="2"/>
        <line x1=${barPx} y1="-5" x2=${barPx} y2="5" stroke="#8794A2" strokeWidth="2"/>
        <text x=${barPx/2} y="-11" fill="#8794A2" fontSize="11" textAnchor="middle"
              letterSpacing="1.4" fontFamily="var(--mono)">${barM} M</text>
      </g>
    </svg>`;
}

/* ---------------------------------------------------------------- 3D sky
   Every element is real data from geometry.sky: satellite az/el propagated from
   broadcast ephemeris at USN8, and the trusted flag from the detector. Nothing
   decorative that could be read as a measurement. */
const D2R = Math.PI / 180;
// Scene frame: x = East, y = Up, z = South (North is -z). az clockwise from N.
const azel = (az, el) => {
  const a = az * D2R, e = el * D2R, c = Math.cos(e);
  return new THREE.Vector3(Math.sin(a) * c, Math.sin(e), -Math.cos(a) * c);
};
const approach = (a, b, s) => a + Math.max(-s, Math.min(s, b - a));
function glowTexture() {
  const c = document.createElement('canvas'); c.width = c.height = 64;
  const g = c.getContext('2d'), grd = g.createRadialGradient(32, 32, 0, 32, 32, 32);
  grd.addColorStop(0.00, 'rgba(255,255,255,1)');
  grd.addColorStop(0.16, 'rgba(255,255,255,0.9)');
  grd.addColorStop(0.42, 'rgba(255,255,255,0.16)');
  grd.addColorStop(1.00, 'rgba(255,255,255,0)');
  g.fillStyle = grd; g.fillRect(0, 0, 64, 64);
  return new THREE.CanvasTexture(c);
}
const SKY_TRUSTED = 0xA9CCEA, SKY_EXCLUDED = 0xE4551F, RAY_ALPHA = 0.34;

function SkyDome({sky, orbit}) {
  const box = useRef(null), lab = useRef(null), S = useRef(null);
  const [ok, setOk] = useState(typeof THREE !== 'undefined');

  useEffect(() => {
    const el = box.current;
    if (!el || typeof THREE === 'undefined') { setOk(false); return; }
    const T = THREE;
    const renderer = new T.WebGLRenderer({antialias:true, alpha:true});
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
    renderer.setClearColor(0x000000, 0);
    el.appendChild(renderer.domElement);
    const scene = new T.Scene();
    const cam = new T.PerspectiveCamera(34, 1, 0.05, 60);
    const st = {renderer, scene, cam, sats:new Map(), w:0, h:0, interval:0, lastMsg:0,
                tStart:performance.now(), theta:-0.62, labels:new Map(), cmp:[]};
    S.current = st;

    const line = (pts, color, opacity=1) => new T.Line(
      new T.BufferGeometry().setFromPoints(pts),
      new T.LineBasicMaterial({color, transparent:true, opacity}));
    const ring = (elDeg, color) => {
      const pts = [], y = Math.sin(elDeg*D2R), r = Math.cos(elDeg*D2R);
      for (let i = 0; i <= 120; i++) { const a = i/120*2*Math.PI;
        pts.push(new T.Vector3(r*Math.sin(a), y, -r*Math.cos(a))); }
      return line(pts, color);
    };
    // graticule: horizon, 30°, 60° rings and meridian spokes every 30°
    scene.add(ring(0, 0x2B333D)); scene.add(ring(30, 0x1C222A)); scene.add(ring(60, 0x1C222A));
    for (let az = 0; az < 360; az += 30) {
      const pts = []; for (let i = 0; i <= 30; i++) pts.push(azel(az, i*3));
      scene.add(line(pts, 0x161B21));
    }
    // horizon disc
    const disc = new T.Mesh(new T.CircleGeometry(1, 120),
      new T.MeshBasicMaterial({color:0x0E1114, transparent:true, opacity:.9, side:T.DoubleSide}));
    disc.rotation.x = -Math.PI/2; disc.position.y = -0.003; scene.add(disc);
    // atmospheric rim: a radial alpha gradient, additive, in the --truth hue
    const rim = new T.Mesh(new T.RingGeometry(0.985, 1.46, 160, 1), new T.ShaderMaterial({
      transparent:true, depthWrite:false, blending:T.AdditiveBlending, side:T.DoubleSide,
      uniforms:{c:{value:new T.Color(0x7FA8CC)}},
      vertexShader:'varying vec2 vP; void main(){ vP=position.xy; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0); }',
      fragmentShader:'uniform vec3 c; varying vec2 vP; void main(){ float t=clamp((length(vP)-0.985)/0.475,0.0,1.0); float a=(1.0-t)*(1.0-t)*0.28; gl_FragColor=vec4(c*a,a); }',
    }));
    rim.rotation.x = -Math.PI/2; rim.position.y = -0.002; scene.add(rim);
    // receiver
    const tex = glowTexture();
    const rx = new T.Sprite(new T.SpriteMaterial({map:tex, color:0xA9CCEA, transparent:true,
      blending:T.AdditiveBlending, depthWrite:false}));
    rx.scale.setScalar(0.07); rx.position.set(0, 0.004, 0); scene.add(rx);
    st.tex = tex;

    // compass labels (HTML, projected each frame)
    const mkLabel = (cls, text) => { const d = document.createElement('div');
      d.className = 'skl ' + cls; d.textContent = text; lab.current.appendChild(d); return d; };
    st.cmp = [['N',0],['E',90],['S',180],['W',270]].map(([t,az]) =>
      ({el: mkLabel('cmp', t), p: azel(az, -4).multiplyScalar(1.19)}));

    const place = () => {
      const w = st.w, h = st.h; if (!w || !h) return;
      const aspect = w / h; cam.aspect = aspect; cam.updateProjectionMatrix();
      // Frame for the horizon ring + compass labels (r~1.2), not the faint rim.
      const dist = Math.max(3.85, 4.1 / Math.max(0.5, aspect));
      const elv = 0.56;
      cam.position.set(dist*Math.cos(elv)*Math.sin(st.theta), dist*Math.sin(elv),
                       dist*Math.cos(elv)*Math.cos(st.theta));
      cam.lookAt(0, 0.20, 0);
    };
    const ro = new ResizeObserver(([e]) => {
      st.w = Math.round(e.contentRect.width); st.h = Math.round(e.contentRect.height);
      renderer.setSize(st.w, st.h, false); place();
    });
    ro.observe(el);

    const v = new T.Vector3();
    const project = (p) => { v.copy(p).project(cam); return [(v.x+1)/2*st.w, (1-v.y)/2*st.h]; };
    let last = performance.now(), raf = 0;
    const loop = () => {
      const now = performance.now(), dt = Math.min(0.1, (now - last)/1000); last = now;
      const iv = st.interval || 70;
      const t = Math.min(1, (now - st.tStart) / iv);
      const fade = dt / 0.5;                       // 0.5 s fades
      for (const [id, r] of st.sats) {
        const daz = ((r.tgt.az - r.prev.az + 540) % 360) - 180;
        r.cur.az = (r.prev.az + daz*t + 360) % 360;
        r.cur.el = r.prev.el + (r.tgt.el - r.prev.el)*t;
        const p = azel(r.cur.az, r.cur.el);
        r.sprite.position.copy(p);
        const pa = r.line.geometry.attributes.position;
        pa.setXYZ(1, p.x, p.y, p.z); pa.needsUpdate = true;
        r.alpha = approach(r.alpha, r.present ? 1 : 0, fade);
        r.ray = approach(r.ray, (r.present && r.trusted) ? 1 : 0, fade);
        r.sprite.material.color.setHex(r.trusted ? SKY_TRUSTED : SKY_EXCLUDED);
        r.sprite.material.opacity = r.alpha * (r.trusted ? 1 : 0.62);
        r.sprite.scale.setScalar(r.trusted ? 0.082 : 0.064);
        r.line.material.opacity = r.ray * RAY_ALPHA;
        const [x, y] = project(p);
        r.lx = x + 9; r.ly = y;
        r.label.style.opacity = r.alpha.toFixed(2);
        r.label.className = 'skl' + (r.trusted ? '' : ' x');
        if (!r.present && r.alpha <= 0) {
          scene.remove(r.sprite); scene.remove(r.line);
          r.sprite.material.dispose(); r.line.geometry.dispose(); r.line.material.dispose();
          r.label.remove(); st.sats.delete(id);
        }
      }
      // Labels of satellites that project close together get nudged apart so
      // both stay readable; sprites themselves are never moved.
      const ls = [...st.sats.values()].filter(r => r.alpha > 0).sort((a, b) => a.ly - b.ly);
      for (let i = 0; i < ls.length; i++) for (let j = 0; j < i; j++) {
        if (Math.abs(ls[i].lx - ls[j].lx) < 40 && ls[i].ly - ls[j].ly < 12) ls[i].ly = ls[j].ly + 12;
      }
      for (const r of ls) { r.label.style.left = r.lx + 'px'; r.label.style.top = r.ly + 'px'; }
      for (const c of st.cmp) { const [x, y] = project(c.p);
        c.el.style.left = x + 'px'; c.el.style.top = y + 'px'; }
      if (orbit) { st.theta += 0.02*dt; place(); }
      renderer.render(scene, cam);
      raf = requestAnimationFrame(loop);
    };
    raf = requestAnimationFrame(loop);

    return () => {
      cancelAnimationFrame(raf); ro.disconnect();
      for (const [, r] of st.sats) { r.label.remove(); }
      for (const c of st.cmp) c.el.remove();
      renderer.dispose(); el.removeChild(renderer.domElement); S.current = null;
    };
  }, [orbit]);

  // new epoch -> new targets; positions lerp toward them over the measured
  // inter-epoch interval so motion is fluid at any replay rate
  useEffect(() => {
    const st = S.current; if (!st) return;
    const now = performance.now();
    if (st.lastMsg) { const dt = now - st.lastMsg; st.interval = st.interval ? st.interval*0.7 + dt*0.3 : dt; }
    st.lastMsg = now; st.tStart = now;
    const seen = new Set();
    for (const s of (sky || [])) {
      seen.add(s.sv);
      let r = st.sats.get(s.sv);
      if (!r) {
        const T = THREE;
        const sprite = new T.Sprite(new T.SpriteMaterial({map:st.tex, transparent:true,
          blending:T.AdditiveBlending, depthWrite:false, opacity:0}));
        const geo = new T.BufferGeometry().setFromPoints([new T.Vector3(0,0,0), azel(s.az, s.el)]);
        const ln = new T.Line(geo, new T.LineBasicMaterial({color:0xA9CCEA, transparent:true, opacity:0}));
        const label = document.createElement('div'); label.className = 'skl';
        label.textContent = s.sv; label.style.opacity = '0'; lab.current.appendChild(label);
        r = {sprite, line:ln, label, alpha:0, ray:0, cur:{az:s.az, el:s.el}, prev:null, tgt:null};
        st.scene.add(sprite); st.scene.add(ln); st.sats.set(s.sv, r);
      }
      r.prev = {az:r.cur.az, el:r.cur.el}; r.tgt = {az:s.az, el:s.el};
      r.trusted = !!s.trusted; r.present = true;
    }
    for (const [id, r] of st.sats) if (!seen.has(id)) r.present = false;
  }, [sky]);

  return html`
    <div className="sky" ref=${box}></div>
    <div className="skylabels" ref=${lab}></div>
    ${!ok && html`<div className="skyidle">3D unavailable — three.js did not load</div>`}
    ${ok && !(sky && sky.length) && html`<div className="skyidle">no sky geometry in stream</div>`}`;
}

function Authority({state}) {
  return html`
    <div className="cell c-auth">
      <div className="lbl">Positional authority</div>
      <div className="state" style=${{color:COLOR[state]}}>${state}</div>
      <div className="sub">${BEHAVIOUR[state]}</div>
    </div>`;
}

function Confidence({conf, credential, thresholds, state}) {
  return html`
    <div className="cell c-conf">
      <div className="lbl">Position confidence</div>
      <div className="bigrow">
        <div className="conf" style=${{color: conf != null ? COLOR[state] : 'var(--faint)'}}>
          ${conf != null ? conf.toFixed(2) : '—'}</div>
        ${credential && html`<div className="cred">credential ${credential}</div>`}
      </div>
      <div className="bar">
        <span style=${{width:((conf||0)*100)+'%', background:COLOR[state]}}></span>
        ${Object.entries(thresholds || {}).map(([k,v]) =>
          html`<i className="tick" key=${k} style=${{left:(v*100)+'%'}}></i>`)}
      </div>
    </div>`;
}

function Features({features}) {
  // Rows are always rendered so the strip height never depends on content.
  // CLAUDE.md: the composite is never shown without these four alongside it.
  return html`
    <div className="cell c-feat">
      <div className="lbl">Which signal diverged</div>
      <div className="frows">
        ${Object.keys(FEATURE_LABEL).map(k => {
          const v = features && typeof features[k] === 'number' ? features[k] : null;
          return html`
            <div className="frow" key=${k}>
              <div className="n">${FEATURE_LABEL[k]}</div>
              <div className="fb"><span style=${{
                width: v == null ? '0%' : (v*100).toFixed(1)+'%',
                background: v != null && v > .45 ? 'var(--accent)' : 'var(--faint)'}}></span></div>
              <div className="v">${v == null ? '—' : v.toFixed(2)}</div>
            </div>`;
        })}
      </div>
    </div>`;
}

function Geometry({geometry, divergence, tracked}) {
  const g = geometry || {};
  const drift = divergence && divergence.ratio_delta != null ? divergence.ratio_delta : null;
  return html`
    <div className="cell c-geom">
      <div className="lbl">Trusted geometry</div>
      <div className="geo">
        <div className="boundwrap">
          <div className=${'bound' + (g.displacement_bound_m != null ? '' : ' none')}>
            ${g.displacement_bound_m != null ? g.displacement_bound_m.toFixed(0) : '—'}</div>
          <div className="boundlbl">m displacement bound</div>
        </div>
        <div className="geokv">
          <div className="kv"><span>information ratio</span>
            <b>${g.information_ratio != null ? g.information_ratio.toFixed(3) : '—'}</b></div>
          <div className="kv"><span>satellites tracked</span><b>${tracked ?? '—'}</b></div>
          <div className="kv"><span>next best observation</span>
            <b>${g.next_best_observation || '—'}</b></div>
          <div className="kv"><span>drift from last trusted</span>
            <b>${drift != null ? drift.toFixed(3) : '—'}</b></div>
        </div>
      </div>
    </div>`;
}

function Dropped({geometry}) {
  // Its own cell with a hard floor wide enough for three chips per row, so the
  // six-satellite attack case wraps to two rows instead of clipping.
  const ex = (geometry || {}).excluded_sv || [];
  return html`
    <div className="cell c-drop">
      <div className="lbl">Dropped from trusted set</div>
      <div className="sv">
        ${ex.length
          ? ex.map(s => html`<span key=${s}>${s}</span>`)
          : html`<span className="none">none</span>`}
      </div>
    </div>`;
}

function App() {
  const [d, setD] = useState(null);
  const [trail, setTrail] = useState([]);
  const [conn, setConn] = useState('connecting');
  const [mission, setMission] = useState(null);
  const mapRef = useRef(null);
  const mapSize = useSize(mapRef);

  useEffect(() => {
    fetch('/mission').then(r => r.json()).then(setMission).catch(() => {});
  }, []);

  useEffect(() => {
    const src = new EventSource('/events' + window.location.search);
    src.onopen = () => setConn('live');
    src.onmessage = e => {
      const m = JSON.parse(e.data);
      setD(m);
      if (m.position) setTrail(t => [...t.slice(-2400),
        {b:{lat:m.position.lat, lon:m.position.lon}}]);
    };
    src.addEventListener('end', () => { setConn('ended'); src.close(); });
    src.onerror = () => setConn(src.readyState === 2 ? 'lost' : 'connecting');
    return () => src.close();
  }, []);

  useEffect(() => {
    const k = e => { if (e.key === 'r' || e.key === 'R') window.location.reload(); };
    window.addEventListener('keydown', k);
    return () => window.removeEventListener('keydown', k);
  }, []);

  const state = d ? d.state : 'NOMINAL';
  const conf = d && d.confidence != null ? d.confidence : null;
  const layerOn = !d || d.layer_on;
  const sky = d && d.geometry && d.geometry.sky;
  const nTrusted = sky ? sky.filter(s => s.trusted).length : 0;
  const nExcl = sky ? sky.length - nTrusted : 0;

  let sep = 0;
  if (d && d.position && mission) {
    const dN = (d.position.lat - mission.surveyed.lat) * mission.m_per_deg_lat;
    const dE = (d.position.lon - mission.surveyed.lon) * mission.m_per_deg_lon;
    sep = Math.hypot(dN, dE);
  }
  const breached = mission && sep > mission.alert_limit_m;
  const showMap = VIEW !== 'sky', showSky = VIEW !== 'map';

  return html`
    <div className="banners">
      ${d && d.synthetic && html`<div className="banner synthetic">
        Synthetic stream — not measured data — replace with Track A output before recording
      </div>`}
      ${d && d.threshold_provenance === 'PLACEHOLDER' && html`<div className="banner provenance">
        Thresholds are placeholders — replace with measured separation points (design.md §10)
      </div>`}
      ${conn === 'lost' && html`<div className="banner unverified">
        Stream disconnected — this display is stale — press R to reconnect
      </div>`}
      ${d && d.explanation_verified === false && html`<div className="banner unverified">
        Explanation claim failed verification — numeric detail withheld
      </div>`}
    </div>

    <div className="strip">
      <${Authority} state=${state}/>
      <${Confidence} conf=${conf} credential=${d && d.credential_status}
                     thresholds=${d && d.thresholds} state=${state}/>
      <${Features} features=${d && d.features}/>
      <${Geometry} geometry=${d && d.geometry} divergence=${d && d.geometry_divergence}
                   tracked=${d && d.satellites_tracked}/>
      <${Dropped} geometry=${d && d.geometry}/>
    </div>

    <div className="stage">
      ${showMap && html`
        <div className="pane" ref=${mapRef}>
          <${Plot} trail=${trail} mission=${mission} sep=${sep} size=${mapSize}/>
          <div className="legend">
            <div><i style=${{borderColor:'var(--accent)'}}></i>believed position</div>
            <div><i style=${{borderColor:'var(--truth)'}}></i>surveyed truth</div>
          </div>
        </div>`}
      ${showSky && html`
        <div className="pane">
          <${SkyDome} sky=${sky} orbit=${ORBIT}/>
          <div className="skycap" style=${{top: showMap ? '18px' : '120px'}}>
            Sky from USN8 · GPS + Galileo
            <div className="n2"><b>${nTrusted}</b> trusted · <b>${nExcl}</b> excluded
              · real ephemeris, ${d && d.timestamp ? d.timestamp.slice(11,19) + ' UTC' : '—'}</div>
          </div>
          <div className="skyleg">
            <div><i style=${{background:'#A9CCEA'}}></i>trusted · line of sight kept</div>
            <div><i style=${{background:'var(--accent)'}}></i>excluded · line of sight dropped</div>
          </div>
        </div>`}
      <div className="readout">
        <div className=${'n' + (breached ? '' : ' safe')}>${sep.toFixed(0)}<span
          style=${{fontSize:'22px',marginLeft:'6px'}}>m</span></div>
        <div className="u">${breached ? 'beyond alert limit' : 'from surveyed position'}</div>
      </div>
      <div className=${'layer kbox' + (layerOn ? '' : ' off')}>
        Trust layer <b>${layerOn ? 'ON' : 'OFF'}</b></div>
      <div className="hint">
        ${conn === 'ended' ? 'replay complete · ' : ''}${conn === 'connecting' ? 'connecting · ' : ''}press R to reset
      </div>
    </div>

    ${d && d.explanation && html`
      <div className="expbar">
        <div className="h">${d.explanation.headline}</div>
        <div className="d">${d.explanation.detail}</div>
      </div>`}`;
}

ReactDOM.createRoot(document.getElementById('root')).render(html`<${App}/>`);
</script>
