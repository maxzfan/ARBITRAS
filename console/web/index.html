<!doctype html>
<meta charset="utf-8">
<title>HOLDFAST</title>
<style>
  :root{
    --bg:#0a0c0e; --panel:#11151a; --line:#1e252d;
    --fg:#dfe5ea; --dim:#8b97a3; --faint:#5d6875;
    --nominal:#4a9d6e; --degraded:#c9993f; --restricted:#c4703a; --surrendered:#b8443f;
    --believed:#5b8fc7; --truth:#b8443f;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{
    background:var(--bg); color:var(--fg);
    font:15px/1.5 ui-monospace,'SF Mono',Menlo,Consolas,monospace;
    -webkit-font-smoothing:antialiased; overflow:hidden;
  }
  #root{height:100vh;display:flex;flex-direction:column}
  .banners{flex:0 0 auto}
  .banner{padding:7px 18px;font-size:13px;letter-spacing:.04em;text-align:center}
  .banner.synthetic{background:#3d1f1f;color:#f0b3b0;border-bottom:1px solid #5e2f2e}
  .banner.provenance{background:#332a12;color:#e6cd8f;border-bottom:1px solid #4d4020}
  .banner.unverified{background:#3d1f1f;color:#f0b3b0}
  main{flex:1;display:grid;grid-template-columns:1fr 420px;min-height:0}
  .left{position:relative;border-right:1px solid var(--line);display:flex;flex-direction:column}
  .right{display:flex;flex-direction:column;min-height:0;overflow:hidden}
  .layer{
    position:absolute;top:18px;right:18px;z-index:5;
    font-size:13px;letter-spacing:.08em;padding:6px 12px;
    border:1px solid var(--line);background:#0d1114cc;color:var(--dim);
  }
  .layer b{color:var(--fg);font-weight:600}
  .plotwrap{flex:1;min-height:0;padding:18px}
  svg{width:100%;height:100%;display:block}
  .legend{position:absolute;bottom:18px;left:22px;font-size:12px;color:var(--dim)}
  .legend i{display:inline-block;width:22px;height:2px;vertical-align:middle;margin-right:7px}
  .sec{padding:16px 20px;border-bottom:1px solid var(--line)}
  .sec:last-child{border-bottom:0}
  .lbl{font-size:11px;letter-spacing:.14em;color:var(--faint);margin-bottom:9px}
  .state{font-size:30px;letter-spacing:.02em;line-height:1.1;font-weight:600}
  .sub{font-size:12px;color:var(--dim);margin-top:5px}
  .bigrow{display:flex;align-items:baseline;gap:10px}
  .conf{font-size:30px;font-variant-numeric:tabular-nums;font-weight:600}
  .bar{height:6px;background:#1a2028;position:relative;margin-top:11px}
  .bar>span{position:absolute;left:0;top:0;bottom:0;transition:width .12s linear}
  .tick{position:absolute;top:-4px;bottom:-4px;width:1px;background:var(--faint)}
  .frow{display:flex;align-items:center;gap:10px;margin:7px 0;font-size:13px}
  .frow .n{width:150px;color:var(--dim);flex:0 0 auto}
  .frow .fb{flex:1;height:5px;background:#1a2028;position:relative}
  .frow .fb>span{position:absolute;inset:0 auto 0 0;background:var(--dim)}
  .frow .v{width:42px;text-align:right;font-variant-numeric:tabular-nums;color:var(--fg)}
  .bound{font-size:38px;font-variant-numeric:tabular-nums;font-weight:600;line-height:1}
  .bound small{font-size:15px;color:var(--dim);font-weight:400;margin-left:5px}
  .kv{display:flex;justify-content:space-between;font-size:13px;margin:5px 0;color:var(--dim)}
  .kv b{color:var(--fg);font-weight:500;font-variant-numeric:tabular-nums}
  .sv{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}
  .sv span{font-size:11px;padding:2px 6px;border:1px solid #4a2f2e;color:#d99a96;background:#2a1a19}
  .exp{padding:18px 20px;background:var(--panel);border-top:1px solid var(--line);flex:0 0 auto}
  .exp .h{font-size:17px;line-height:1.35;margin-bottom:8px}
  .exp .d{font-size:13px;color:var(--dim);line-height:1.6}
  .hint{position:absolute;bottom:18px;right:22px;font-size:11px;color:var(--faint)}
  .idle{display:flex;height:100%;align-items:center;justify-content:center;color:var(--faint);font-size:14px}
</style>
<div id="root"></div>
<script src="/vendor/react.js"></script>
<script src="/vendor/react-dom.js"></script>
<script type="module">
import htmMod from '/vendor/htm.js';
const {useState,useEffect,useRef} = React;
const html = htmMod.bind(React.createElement);

const COLOR = {NOMINAL:'var(--nominal)',DEGRADED:'var(--degraded)',
               RESTRICTED:'var(--restricted)',SURRENDERED:'var(--surrendered)'};
const BEHAVIOUR = {
  NOMINAL:'Full autonomy · accepting waypoints',
  DEGRADED:'Coasting on inertial · discrepancy flagged',
  RESTRICTED:'Current leg only · waypoints refused',
  SURRENDERED:'Holding position · operator has control',
};
const FEATURE_LABEL = {
  cn0_anomaly:'C/N₀ anomaly', pseudorange_residual:'range residual',
  code_carrier_divergence:'code−carrier', cross_constellation:'cross-constellation',
};

function TrackPlot({trail}) {
  if (!trail.length) return html`<div className="idle">waiting for epochs</div>`;
  const pts = trail.flatMap(p => [p.b, p.t].filter(Boolean));
  const lats = pts.map(p=>p.lat), lons = pts.map(p=>p.lon);
  const pad = 0.00035;
  const y0 = Math.min(...lats)-pad, y1 = Math.max(...lats)+pad;
  const x0 = Math.min(...lons)-pad, x1 = Math.max(...lons)+pad;
  const W=1000, H=620;
  const sx = p => ((p.lon-x0)/((x1-x0)||1))*W;
  const sy = p => H-((p.lat-y0)/((y1-y0)||1))*H;
  const path = key => trail.filter(p=>p[key])
    .map((p,i)=>`${i?'L':'M'}${sx(p[key]).toFixed(1)},${sy(p[key]).toFixed(1)}`).join(' ');
  const last = trail[trail.length-1];
  // metres between believed and true, for the separation readout in beat 2
  let sep = null;
  if (last.b && last.t) {
    const dLat = (last.t.lat-last.b.lat)*111320;
    const dLon = (last.t.lon-last.b.lon)*111320*Math.cos(last.b.lat*Math.PI/180);
    sep = Math.hypot(dLat,dLon);
  }
  return html`
    <svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet">
      <path d=${path('t')} fill="none" stroke="var(--truth)" stroke-width="2.5"
            stroke-dasharray="7 5" opacity=".9"/>
      <path d=${path('b')} fill="none" stroke="var(--believed)" stroke-width="2.5"/>
      ${last.t && html`<circle cx=${sx(last.t)} cy=${sy(last.t)} r="6"
                               fill="var(--truth)"/>`}
      ${last.b && html`<circle cx=${sx(last.b)} cy=${sy(last.b)} r="6"
                               fill="var(--believed)"/>`}
      ${sep !== null && sep > 1 && html`
        <text x=${W-14} y="30" text-anchor="end" fill="var(--dim)"
              font-size="22" font-family="ui-monospace,monospace">
          ${sep.toFixed(0)} m off route
        </text>`}
    </svg>`;
}

function Features({features}) {
  const keys = Object.keys(FEATURE_LABEL).filter(k => features && k in features);
  if (!keys.length) return null;
  return html`
    <div className="sec">
      <div className="lbl">WHICH SIGNAL DIVERGED</div>
      ${keys.map(k => html`
        <div className="frow" key=${k}>
          <div className="n">${FEATURE_LABEL[k]}</div>
          <div className="fb"><span style=${{width:(features[k]*100).toFixed(1)+'%',
            background: features[k] > .5 ? 'var(--restricted)' : 'var(--dim)'}}></span></div>
          <div className="v">${features[k].toFixed(2)}</div>
        </div>`)}
    </div>`;
}

function Geometry({geometry, divergence}) {
  const g = geometry || {};
  if (g.displacement_bound_m == null && g.information_ratio == null) return null;
  const ex = g.excluded_sv || [];
  return html`
    <div className="sec">
      <div className="lbl">TRUSTED GEOMETRY</div>
      ${g.displacement_bound_m != null && html`
        <div className="bound">${g.displacement_bound_m.toFixed(0)}<small>m displacement bound</small></div>`}
      ${g.information_ratio != null && html`
        <div className="kv" style="margin-top:12px">
          <span>information ratio</span><b>${g.information_ratio.toFixed(3)}</b></div>`}
      <div className="kv"><span>satellites trusted</span>
        <b>${g.satellites_tracked ?? '—'}</b></div>
      ${g.next_best_observation && html`
        <div className="kv"><span>next best observation</span>
          <b>${g.next_best_observation}</b></div>`}
      ${ex.length > 0 && html`
        <div><div className="lbl" style="margin-top:13px">DROPPED FROM TRUSTED SET</div>
          <div className="sv">${ex.map(s => html`<span key=${s}>${s}</span>`)}</div></div>`}
      ${divergence && divergence.frozen_information_ratio != null && html`
        <div className="kv" style="margin-top:13px">
          <span>drift from last trusted epoch</span>
          <b>${divergence.ratio_delta != null ? divergence.ratio_delta.toFixed(3) : '—'}</b></div>`}
    </div>`;
}

function App() {
  const [d,setD] = useState(null);
  const [trail,setTrail] = useState([]);
  const [ended,setEnded] = useState(false);
  const es = useRef(null);

  useEffect(() => {
    const q = window.location.search;
    const src = new EventSource('/events' + q);
    es.current = src;
    src.onmessage = e => {
      const m = JSON.parse(e.data);
      setD(m);
      if (m.position) setTrail(t => [...t.slice(-2400), {
        b:{lat:m.position.lat, lon:m.position.lon},
        t:m._truth ? {lat:m._truth.lat, lon:m._truth.lon} : null,
      }]);
    };
    src.addEventListener('end', () => setEnded(true));
    return () => src.close();
  }, []);

  useEffect(() => {
    const onKey = e => { if (e.key === 'r' || e.key === 'R') window.location.reload(); };
    window.addEventListener('keydown', onKey);
    return () => window.removeEventListener('keydown', onKey);
  }, []);

  const state = d ? d.state : 'NOMINAL';
  const conf = d && d.confidence != null ? d.confidence : null;
  const th = (d && d.thresholds) || {};
  const layerOn = !d || d.layer_on;

  return html`
    <div className="banners">
      ${d && d.synthetic && html`<div className="banner synthetic">
        SYNTHETIC STREAM — not measured data. Must be replaced with Track A output before recording.
      </div>`}
      ${d && d.threshold_provenance === 'PLACEHOLDER' && html`<div className="banner provenance">
        THRESHOLDS ARE PLACEHOLDERS — replace with measured separation points (design.md §10)
      </div>`}
      ${d && d.explanation_verified === false && html`<div className="banner unverified">
        EXPLANATION CLAIM FAILED VERIFICATION — numeric detail withheld
      </div>`}
    </div>
    <main>
      <div className="left">
        <div className="layer">Trust layer: <b>${layerOn ? 'ON' : 'OFF'}</b></div>
        <div className="plotwrap"><${TrackPlot} trail=${trail}/></div>
        <div className="legend">
          <div><i style="background:var(--believed)"></i>believed position</div>
          <div style="margin-top:5px"><i style="background:var(--truth)"></i>true position</div>
        </div>
        <div className="hint">${ended ? 'replay complete · ' : ''}press r to reset</div>
      </div>
      <div className="right">
        <div className="sec">
          <div className="lbl">POSITIONAL AUTHORITY</div>
          <div className="state" style=${{color:COLOR[state]}}>${state}</div>
          <div className="sub">${BEHAVIOUR[state]}</div>
        </div>
        <div className="sec">
          <div className="lbl">POSITION CONFIDENCE</div>
          <div className="bigrow">
            <div className="conf">${conf != null ? conf.toFixed(2) : '—'}</div>
            ${d && d.credential_status && html`
              <div className="sub">credential ${d.credential_status}</div>`}
          </div>
          <div className="bar">
            <span style=${{width:((conf||0)*100)+'%', background:COLOR[state]}}></span>
            ${Object.entries(th).map(([k,v]) =>
              html`<i className="tick" key=${k} style=${{left:(v*100)+'%'}}></i>`)}
          </div>
        </div>
        <${Features} features=${d && d.features}/>
        <${Geometry} geometry=${d && {...(d.geometry||{}),
                                      satellites_tracked:d.satellites_tracked}}
                     divergence=${d && d.geometry_divergence}/>
        <div style="flex:1"></div>
        ${d && d.explanation && html`
          <div className="exp">
            <div className="h">${d.explanation.headline}</div>
            <div className="d">${d.explanation.detail}</div>
          </div>`}
      </div>
    </main>`;
}

ReactDOM.createRoot(document.getElementById('root')).render(html`<${App}/>`);
</script>
