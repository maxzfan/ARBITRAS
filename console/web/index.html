<!doctype html>
<meta charset="utf-8">
<title>HOLDFAST</title>
<style>
  /* Vendored so the console runs offline (design.md §14: venue wifi is a risk).
     font-display:block avoids a flash of fallback metrics mid-capture. */
  @font-face{font-family:'Inter';font-style:normal;font-weight:400;font-display:block;
             src:url('/vendor/inter-400.woff2') format('woff2')}
  @font-face{font-family:'Inter';font-style:normal;font-weight:500;font-display:block;
             src:url('/vendor/inter-500.woff2') format('woff2')}
  @font-face{font-family:'Inter';font-style:normal;font-weight:600;font-display:block;
             src:url('/vendor/inter-600.woff2') format('woff2')}
  @font-face{font-family:'Inter';font-style:normal;font-weight:700;font-display:block;
             src:url('/vendor/inter-700.woff2') format('woff2')}
  :root{
    --bg:#0B0D0F; --panel:#0E1114; --line:#1C222A; --keyline:#2B333D;
    --fg:#EEF2F6; --dim:#8794A2; --faint:#4E5A67;
    --accent:#E4551F;
    --nominal:#D8E2EC; --degraded:#E8A21C; --restricted:#E4551F; --surrendered:#D62119;
    --believed:#E4551F; --truth:#7FA8CC;
    /* Three tiers, deliberately: condensed-black for display numbers, Inter
       for prose and labels, mono for aligned instrument data. */
    --display:"Helvetica Neue","Arial Narrow",Impact,system-ui,sans-serif;
    --sans:'Inter',system-ui,-apple-system,sans-serif;
    --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{background:var(--bg);color:var(--fg);font:13px/1.5 var(--sans);
       -webkit-font-smoothing:antialiased;overflow:hidden}
  #root{height:100vh;display:flex;flex-direction:column}
  .banners{flex:0 0 auto}
  .banner{padding:8px 20px;font-size:11px;letter-spacing:.14em;text-transform:uppercase;
          text-align:center;font-weight:600;font-family:var(--sans)}
  .banner.synthetic{background:var(--surrendered);color:#fff}
  .banner.provenance{background:#2A2410;color:var(--degraded);
                     border-bottom:1px solid #453A18}
  .banner.unverified{background:var(--surrendered);color:#fff}

  /* ---- horizontal instrument strip -------------------------------------
     Fixed height on purpose: the stage below must start at the same y in
     every configuration, so the Trust layer badge is pixel-identical
     between layer=on and layer=off (design.md §11b). */
  .strip{flex:0 0 auto;height:156px;display:flex;
         border-bottom:1px solid var(--keyline);background:var(--panel)}
  .cell{padding:13px 17px;border-right:1px solid var(--line);min-width:0;
        display:flex;flex-direction:column;overflow:hidden}
  .cell:last-child{border-right:0}
  /* flex-basis sets the comfortable width, min-width the hard floor. Floors sum
     to ~1275px so nothing clips down to a 1280 viewport. */
  .c-auth{flex:0 1 330px;min-width:268px}
  .c-conf{flex:1 1 250px;min-width:186px}
  .c-feat{flex:1 1 380px;min-width:226px}
  .c-geom{flex:1 1 430px;min-width:398px}
  .c-drop{flex:0 0 196px;min-width:196px}
  .lbl{font-family:var(--sans);font-weight:600;font-size:10px;letter-spacing:.16em;
     color:var(--faint);text-transform:uppercase;margin-bottom:9px;white-space:nowrap}
  .state{font-family:var(--display);font-weight:900;font-size:40px;line-height:.94;
         letter-spacing:-.02em;font-stretch:condensed;text-transform:uppercase}
  .sub{font-family:var(--sans);font-size:12.5px;color:var(--dim);margin-top:8px;
     line-height:1.4}
  .conf{font-family:var(--display);font-weight:900;font-size:40px;line-height:1;
        letter-spacing:-.02em;font-variant-numeric:tabular-nums}
  .bigrow{display:flex;align-items:baseline;gap:11px;flex-wrap:wrap}
  .cred{font-family:var(--sans);font-weight:500;font-size:10px;letter-spacing:.12em;
      text-transform:uppercase;color:var(--dim)}
  .bar{height:8px;background:#171C22;position:relative;margin-top:13px;
       border:1px solid var(--line)}
  .bar>span{position:absolute;left:0;top:0;bottom:0}
  .tick{position:absolute;top:-3px;bottom:-3px;width:1px;background:var(--faint)}
  .frows{display:flex;flex-direction:column;gap:6px}
  .frow{display:flex;align-items:center;gap:10px;font-size:11px}
  .frow .n{font-family:var(--sans);font-weight:500;flex:0 1 112px;min-width:92px;
           color:var(--dim);text-transform:uppercase;font-size:10px;letter-spacing:.07em;
           white-space:nowrap}
  .frow .fb{flex:1 1 auto;height:7px;background:#171C22;position:relative;
            border:1px solid var(--line);min-width:24px}
  .frow .fb>span{position:absolute;inset:0 auto 0 0}
  .frow .v{font-family:var(--mono);width:36px;text-align:right;
         font-variant-numeric:tabular-nums;font-size:11px;flex:0 0 auto}
  .geo{display:flex;gap:22px;align-items:flex-start;min-width:0}
  .boundwrap{flex:0 0 auto}
  .bound{font-family:var(--display);font-weight:900;font-size:44px;line-height:1;
         letter-spacing:-.03em;font-variant-numeric:tabular-nums;color:var(--accent);
         white-space:nowrap}
  .bound.none{color:var(--faint)}
  .boundlbl{font-family:var(--sans);font-weight:600;font-size:10px;color:var(--dim);
            letter-spacing:.11em;text-transform:uppercase;margin-top:6px;max-width:120px;
            line-height:1.3}
  .geokv{flex:1 1 auto;min-width:0}
  .kv{font-family:var(--mono);display:flex;justify-content:space-between;gap:16px;
    font-size:11px;margin:4px 0;color:var(--dim);letter-spacing:.02em;
    white-space:nowrap;font-variant-numeric:tabular-nums}
  .kv b{color:var(--fg);font-weight:500;font-variant-numeric:tabular-nums}
  .sv{display:flex;flex-wrap:wrap;gap:5px}
  .sv span{font-family:var(--mono);font-size:10px;padding:3px 7px;
         border:1px solid var(--accent);color:var(--accent);letter-spacing:.06em}
  .sv span.none{border-color:var(--line);color:var(--faint)}
  .c-drop .lbl{white-space:normal;line-height:1.35}

  /* ---- stage: the plot gets everything left over ---------------------- */
  .stage{flex:1;position:relative;min-height:0;overflow:hidden}
  svg{width:100%;height:100%;display:block}
  .kbox{border:1px solid var(--keyline);background:#0B0D0Fcc;padding:9px 12px}
  .layer{position:absolute;top:20px;right:20px;z-index:5;font-size:11px;
         letter-spacing:.16em;text-transform:uppercase}
  .layer b{color:var(--fg);font-weight:700;display:inline-block;width:30px;
         text-align:left}
  .layer.off b{color:var(--surrendered)}
  .readout{position:absolute;top:18px;left:20px;z-index:5}
  .readout .n{font-family:var(--display);font-weight:900;font-size:58px;line-height:.9;
              letter-spacing:-.03em;font-stretch:condensed;color:var(--accent)}
  .readout .n.safe{color:var(--dim)}
  .readout .u{font-family:var(--sans);font-weight:600;font-size:11px;letter-spacing:.13em;
            color:var(--dim);text-transform:uppercase;margin-top:6px}
  .legend{position:absolute;top:120px;left:20px;z-index:5;font-family:var(--sans);
        font-weight:500;font-size:11px;letter-spacing:.08em;text-transform:uppercase;
        color:var(--dim)}
  .legend div{display:flex;align-items:center;gap:9px;margin-top:6px}
  .legend i{width:26px;height:0;border-top:2px solid}
  .hint{position:absolute;bottom:18px;right:20px;z-index:5;font-family:var(--sans);
      font-weight:500;font-size:10px;letter-spacing:.12em;text-transform:uppercase;
      color:var(--faint)}
  .idle{display:flex;height:100%;align-items:center;justify-content:center;
      font-family:var(--sans);font-weight:500;color:var(--faint);font-size:11px;
      letter-spacing:.16em;text-transform:uppercase}

  /* ---- explanation, full width so it is never clipped ----------------- */
  .expbar{flex:0 0 auto;border-top:1px solid var(--keyline);background:#0A0C0E;
          padding:15px 24px;display:grid;grid-template-columns:minmax(260px,26%) 1fr;
          gap:30px;align-items:start}
  .expbar .h{font-family:var(--sans);font-weight:700;font-size:19px;line-height:1.28;
           letter-spacing:-.005em}
  .expbar .d{font-family:var(--sans);font-weight:400;font-size:13px;color:var(--dim);
           line-height:1.62;max-width:132ch}
</style>
<div id="root"></div>
<script>
window.__fatal = function (msg) {
  var r = document.getElementById('root');
  if (!r) return;
  r.innerHTML = '<pre style="margin:0;min-height:100vh;padding:26px;background:#3d1f1f;'
    + 'color:#f0b3b0;white-space:pre-wrap;font:13px/1.6 ui-monospace,Menlo,monospace">'
    + 'CONSOLE FAILED TO START\n\n' + String(msg).replace(/</g, '&lt;') + '</pre>';
};
window.addEventListener('error', function (e) {
  window.__fatal((e.message || 'error') + '\n  at ' + (e.filename || '?') + ':' + (e.lineno || '?'));
});
window.addEventListener('unhandledrejection', function (e) {
  window.__fatal('unhandled rejection: ' + ((e.reason && e.reason.message) || e.reason));
});
setTimeout(function () {
  var r = document.getElementById('root');
  if (r && r.children.length === 0) {
    window.__fatal('React did not mount within 4s.\n\ntypeof React    = ' + (typeof React)
      + '\ntypeof ReactDOM = ' + (typeof ReactDOM)
      + '\ncreateRoot      = ' + (typeof (window.ReactDOM || {}).createRoot));
  }
}, 4000);
</script>
<script src="/vendor/react.js"></script>
<script src="/vendor/react-dom.js"></script>
<script type="module">
import htmMod from '/vendor/htm.js';
const {useState, useEffect} = React;
const html = htmMod.bind(React.createElement);

const COLOR = {NOMINAL:'var(--nominal)', DEGRADED:'var(--degraded)',
               RESTRICTED:'var(--restricted)', SURRENDERED:'var(--surrendered)'};
const BEHAVIOUR = {
  NOMINAL:'Full autonomy · accepting waypoints',
  DEGRADED:'Coasting on inertial · discrepancy flagged',
  RESTRICTED:'Current leg only · waypoints refused',
  SURRENDERED:'Holding position · operator has control',
};
const FEATURE_LABEL = {
  cn0_anomaly:'C/N0 anomaly', pseudorange_residual:'range residual',
  code_carrier_divergence:'code−carrier', cross_constellation:'cross-constel',
};
const niceStep = s => {
  const p = Math.pow(10, Math.floor(Math.log10(s))), n = s / p;
  return (n >= 5 ? 5 : n >= 2 ? 2 : 1) * p;
};

function Plot({trail, mission, sep}) {
  if (!mission) return html`<div className="idle">loading mission</div>`;
  // Wide, short viewBox to match the full-width stage under the strip.
  const W = 1400, H = 560, cx = W/2, cy = H/2;
  const AL = mission.alert_limit_m;
  // Frame on the surveyed point; expand as displacement grows so the alert ring
  // is always legible and the plot never sits in a void.
  const span = Math.max(AL * 2.6, (sep || 0) * 1.45, 12);   // metres, half-height
  const ppm = (H/2 - 40) / span;
  const toXY = p => {
    const dN = (p.lat - mission.surveyed.lat) * mission.m_per_deg_lat;
    const dE = (p.lon - mission.surveyed.lon) * mission.m_per_deg_lon;
    return [cx + dE*ppm, cy - dN*ppm];
  };
  // Ring spacing keyed to the horizontal extent; the cap keeps the outermost
  // label inside the viewBox instead of clipping it at the right edge.
  const step = niceStep(span*0.7), rings = [];
  for (let r = step; r <= span*2.6; r += step) rings.push(r);
  const path = trail.filter(p=>p.b).map((p,i)=>{
    const [x,y] = toXY(p.b); return `${i?'L':'M'}${x.toFixed(1)},${y.toFixed(1)}`;
  }).join(' ');
  const last = trail.length ? trail[trail.length-1] : null;
  const bxy = last && last.b ? toXY(last.b) : null;
  const barM = niceStep(span*0.6), barPx = barM*ppm;

  return html`
    <svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet">
      <defs>
        <pattern id="grat" width="50" height="50" patternUnits="userSpaceOnUse">
          <path d="M50 0 L0 0 0 50" fill="none" stroke="#161B21" strokeWidth="1"/>
        </pattern>
      </defs>
      <rect width=${W} height=${H} fill="url(#grat)"/>
      <line x1="0" y1=${cy} x2=${W} y2=${cy} stroke="#1C222A"/>
      <line x1=${cx} y1="0" x2=${cx} y2=${H} stroke="#1C222A"/>
      ${rings.map(r => html`<g key=${r}>
        <circle cx=${cx} cy=${cy} r=${r*ppm} fill="none" stroke="#1C222A"
                strokeDasharray="2 5"/>
        <text x=${cx + r*ppm + 5} y=${cy - 5} fill="#4E5A67" fontSize="11"
              fontFamily="ui-monospace,monospace">${r} m</text>
      </g>`)}
      <circle cx=${cx} cy=${cy} r=${AL*ppm} fill="none" stroke="var(--degraded)"
              strokeWidth="1.5" strokeDasharray="9 6" opacity=".75"/>
      <text x=${cx + AL*ppm*0.74} y=${cy - AL*ppm*0.74} fill="var(--degraded)"
            fontSize="12" letterSpacing="1.6" fontFamily="ui-monospace,monospace">
        ALERT LIMIT ${AL} M
      </text>
      ${bxy && html`<line x1=${cx} y1=${cy} x2=${bxy[0]} y2=${bxy[1]}
                          stroke="var(--accent)" strokeWidth="1" strokeDasharray="3 4"
                          opacity=".65"/>`}
      <path d=${path} fill="none" stroke="var(--accent)" strokeWidth="2.5"/>
      <g stroke="var(--truth)" strokeWidth="2">
        <line x1=${cx-11} y1=${cy} x2=${cx+11} y2=${cy}/>
        <line x1=${cx} y1=${cy-11} x2=${cx} y2=${cy+11}/>
      </g>
      <text x=${cx-20} y=${cy-19} fill="var(--truth)" fontSize="11" letterSpacing="1.4"
            textAnchor="end" fontFamily="ui-monospace,monospace">USN8 SURVEYED</text>
      ${bxy && html`<circle cx=${bxy[0]} cy=${bxy[1]} r="7" fill="var(--accent)"/>`}
      <g transform=${`translate(24,${H-24})`}>
        <line x1="0" y1="0" x2=${barPx} y2="0" stroke="#8794A2" strokeWidth="2"/>
        <line x1="0" y1="-5" x2="0" y2="5" stroke="#8794A2" strokeWidth="2"/>
        <line x1=${barPx} y1="-5" x2=${barPx} y2="5" stroke="#8794A2" strokeWidth="2"/>
        <text x=${barPx/2} y="-11" fill="#8794A2" fontSize="11" textAnchor="middle"
              letterSpacing="1.4" fontFamily="ui-monospace,monospace">${barM} M</text>
      </g>
    </svg>`;
}

function Authority({state}) {
  return html`
    <div className="cell c-auth">
      <div className="lbl">Positional authority</div>
      <div className="state" style=${{color:COLOR[state]}}>${state}</div>
      <div className="sub">${BEHAVIOUR[state]}</div>
    </div>`;
}

function Confidence({conf, credential, thresholds, state}) {
  return html`
    <div className="cell c-conf">
      <div className="lbl">Position confidence</div>
      <div className="bigrow">
        <div className="conf" style=${{color: conf != null ? COLOR[state] : 'var(--faint)'}}>
          ${conf != null ? conf.toFixed(2) : '—'}</div>
        ${credential && html`<div className="cred">credential ${credential}</div>`}
      </div>
      <div className="bar">
        <span style=${{width:((conf||0)*100)+'%', background:COLOR[state]}}></span>
        ${Object.entries(thresholds || {}).map(([k,v]) =>
          html`<i className="tick" key=${k} style=${{left:(v*100)+'%'}}></i>`)}
      </div>
    </div>`;
}

function Features({features}) {
  // Rows are always rendered so the strip height never depends on content.
  // CLAUDE.md: the composite is never shown without these four alongside it.
  return html`
    <div className="cell c-feat">
      <div className="lbl">Which signal diverged</div>
      <div className="frows">
        ${Object.keys(FEATURE_LABEL).map(k => {
          const v = features && typeof features[k] === 'number' ? features[k] : null;
          return html`
            <div className="frow" key=${k}>
              <div className="n">${FEATURE_LABEL[k]}</div>
              <div className="fb"><span style=${{
                width: v == null ? '0%' : (v*100).toFixed(1)+'%',
                background: v != null && v > .45 ? 'var(--accent)' : 'var(--faint)'}}></span></div>
              <div className="v">${v == null ? '—' : v.toFixed(2)}</div>
            </div>`;
        })}
      </div>
    </div>`;
}

function Geometry({geometry, divergence, tracked}) {
  const g = geometry || {};
  const drift = divergence && divergence.ratio_delta != null ? divergence.ratio_delta : null;
  return html`
    <div className="cell c-geom">
      <div className="lbl">Trusted geometry</div>
      <div className="geo">
        <div className="boundwrap">
          <div className=${'bound' + (g.displacement_bound_m != null ? '' : ' none')}>
            ${g.displacement_bound_m != null ? g.displacement_bound_m.toFixed(0) : '—'}</div>
          <div className="boundlbl">m displacement bound</div>
        </div>
        <div className="geokv">
          <div className="kv"><span>information ratio</span>
            <b>${g.information_ratio != null ? g.information_ratio.toFixed(3) : '—'}</b></div>
          <div className="kv"><span>satellites tracked</span><b>${tracked ?? '—'}</b></div>
          <div className="kv"><span>next best observation</span>
            <b>${g.next_best_observation || '—'}</b></div>
          <div className="kv"><span>drift from last trusted</span>
            <b>${drift != null ? drift.toFixed(3) : '—'}</b></div>
        </div>
      </div>
    </div>`;
}

function Dropped({geometry}) {
  // Its own cell with a hard floor wide enough for three chips per row, so the
  // six-satellite attack case wraps to two rows instead of clipping.
  const ex = (geometry || {}).excluded_sv || [];
  return html`
    <div className="cell c-drop">
      <div className="lbl">Dropped from trusted set</div>
      <div className="sv">
        ${ex.length
          ? ex.map(s => html`<span key=${s}>${s}</span>`)
          : html`<span className="none">none</span>`}
      </div>
    </div>`;
}

function App() {
  const [d, setD] = useState(null);
  const [trail, setTrail] = useState([]);
  const [conn, setConn] = useState('connecting');
  const [mission, setMission] = useState(null);

  useEffect(() => {
    fetch('/mission').then(r => r.json()).then(setMission).catch(() => {});
  }, []);

  useEffect(() => {
    const src = new EventSource('/events' + window.location.search);
    src.onopen = () => setConn('live');
    src.onmessage = e => {
      const m = JSON.parse(e.data);
      setD(m);
      if (m.position) setTrail(t => [...t.slice(-2400),
        {b:{lat:m.position.lat, lon:m.position.lon}}]);
    };
    src.addEventListener('end', () => { setConn('ended'); src.close(); });
    src.onerror = () => setConn(src.readyState === 2 ? 'lost' : 'connecting');
    return () => src.close();
  }, []);

  useEffect(() => {
    const k = e => { if (e.key === 'r' || e.key === 'R') window.location.reload(); };
    window.addEventListener('keydown', k);
    return () => window.removeEventListener('keydown', k);
  }, []);

  const state = d ? d.state : 'NOMINAL';
  const conf = d && d.confidence != null ? d.confidence : null;
  const layerOn = !d || d.layer_on;

  let sep = 0;
  if (d && d.position && mission) {
    const dN = (d.position.lat - mission.surveyed.lat) * mission.m_per_deg_lat;
    const dE = (d.position.lon - mission.surveyed.lon) * mission.m_per_deg_lon;
    sep = Math.hypot(dN, dE);
  }
  const breached = mission && sep > mission.alert_limit_m;

  return html`
    <div className="banners">
      ${d && d.synthetic && html`<div className="banner synthetic">
        Synthetic stream — not measured data — replace with Track A output before recording
      </div>`}
      ${d && d.threshold_provenance === 'PLACEHOLDER' && html`<div className="banner provenance">
        Thresholds are placeholders — replace with measured separation points (design.md §10)
      </div>`}
      ${conn === 'lost' && html`<div className="banner unverified">
        Stream disconnected — this display is stale — press R to reconnect
      </div>`}
      ${d && d.explanation_verified === false && html`<div className="banner unverified">
        Explanation claim failed verification — numeric detail withheld
      </div>`}
    </div>

    <div className="strip">
      <${Authority} state=${state}/>
      <${Confidence} conf=${conf} credential=${d && d.credential_status}
                     thresholds=${d && d.thresholds} state=${state}/>
      <${Features} features=${d && d.features}/>
      <${Geometry} geometry=${d && d.geometry} divergence=${d && d.geometry_divergence}
                   tracked=${d && d.satellites_tracked}/>
      <${Dropped} geometry=${d && d.geometry}/>
    </div>

    <div className="stage">
      <div className="readout">
        <div className=${'n' + (breached ? '' : ' safe')}>${sep.toFixed(0)}<span
          style=${{fontSize:'22px',marginLeft:'6px'}}>m</span></div>
        <div className="u">${breached ? 'beyond alert limit' : 'from surveyed position'}</div>
      </div>
      <div className=${'layer kbox' + (layerOn ? '' : ' off')}>
        Trust layer <b>${layerOn ? 'ON' : 'OFF'}</b></div>
      <${Plot} trail=${trail} mission=${mission} sep=${sep}/>
      <div className="legend">
        <div><i style=${{borderColor:'var(--accent)'}}></i>believed position</div>
        <div><i style=${{borderColor:'var(--truth)'}}></i>surveyed truth</div>
      </div>
      <div className="hint">
        ${conn === 'ended' ? 'replay complete · ' : ''}${conn === 'connecting' ? 'connecting · ' : ''}press R to reset
      </div>
    </div>

    ${d && d.explanation && html`
      <div className="expbar">
        <div className="h">${d.explanation.headline}</div>
        <div className="d">${d.explanation.detail}</div>
      </div>`}`;
}

ReactDOM.createRoot(document.getElementById('root')).render(html`<${App}/>`);
</script>
